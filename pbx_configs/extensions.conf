; ============================================================
; Loop C2 — per-agent dial-permission cascade (toll-fraud guard).
;
; BEFORE this, [from-agent] matched a bare `_X.` — ANY number an agent's
; softphone dialed, no restriction at all. Since a SIP secret lives in the
; agent's browser memory (src/lib/pjsip-config.ts's generated endpoints),
; a compromised session could dial premium-rate/satellite numbers freely —
; the classic toll-fraud vector. Extension.dialPermission (Prisma,
; LOCAL|NATIONAL|INTERNATIONAL, default LOCAL) now selects which of the
; three contexts below a generated endpoint's `context=` points at.
;
; CONFIDENCE: MEDIUM on the exact prefix patterns below — real UAE/India
; numbering-plan conventions, but not independently re-verified against a
; live trunk by a telecom specialist. Same honesty standard this repo
; already applies to func_odbc.conf's DNC normalization gap: verify/tighten
; with whoever owns telecom cost before trusting this as the SOLE
; toll-fraud control. Also inherits that same gap's root limitation — EXTEN
; here is whatever the softphone dialed as-is (dialpad.tsx sends raw
; digits), NOT run through phone-normalize.ts's E.164 normalization (the
; dialplan can't call a TypeScript function) — this only reliably matches
; the dialing conventions actually used against this trunk.
;
; Hard-blocked prefixes (satellite: Inmarsat/Thuraya/Iridium; known
; international premium-rate ranges) are declared ONCE, in the base
; [from-agent-local] context, and are MORE SPECIFIC (fixed-prefix, no
; trailing `_X.` bucket) than every "allow" pattern in every tier —
; Asterisk always resolves to the single best/most-specific match across a
; context's own patterns and everything it includes, so a wider
; permission tier cannot bypass this by definition, not just by ordering.
; This list is representative, NOT exhaustive.
; ============================================================

[from-agent-local]
; Emergency-number policy (see this repo's GO_LIVE_CHECKLIST.md Gate 4):
; agents dial from India, but this PBX's only outbound
; trunk is a UAE GSM SIM (see CLAUDE.md's hard constraints) — a PBX-dialed
; "emergency" number would reach UAE emergency services, not India's,
; regardless of where the agent physically is. There is no correct way
; for this system to route a real emergency call, so misdials are blocked
; outright rather than silently connecting to the wrong country's
; responders; the operator runbook must tell agents to use their own
; mobile for any real emergency. Exact-match (not prefix) so this can
; never accidentally swallow a real destination.
exten => 999,1,Goto(from-agent-common,dial-permission-blocked,1)   ; UAE police
exten => 998,1,Goto(from-agent-common,dial-permission-blocked,1)   ; UAE ambulance
exten => 997,1,Goto(from-agent-common,dial-permission-blocked,1)   ; UAE civil defense (fire)
exten => 112,1,Goto(from-agent-common,dial-permission-blocked,1)   ; EU/GSM-standard emergency
exten => 911,1,Goto(from-agent-common,dial-permission-blocked,1)   ; NANP emergency
exten => 100,1,Goto(from-agent-common,dial-permission-blocked,1)   ; India police
exten => 101,1,Goto(from-agent-common,dial-permission-blocked,1)   ; India fire
exten => 102,1,Goto(from-agent-common,dial-permission-blocked,1)   ; India ambulance
exten => 108,1,Goto(from-agent-common,dial-permission-blocked,1)   ; India emergency (some states)

exten => _+870.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00870.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+871.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00871.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+872.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00872.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+873.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00873.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+874.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00874.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+881.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00881.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+882.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00882.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+883.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00883.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+888.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00888.,1,Goto(from-agent-common,dial-permission-blocked,1)

; UAE mobile (05X + 8 digits, or +9715X / 009715X form) and landline
; (area code 2-9 + 7 digits, or +971[2-9] / 00971[2-9] form) — the base
; tier every extension gets by default.
exten => _05XXXXXXXX,1,Goto(from-agent-common,${EXTEN},1)
exten => _+9715XXXXXXXX,1,Goto(from-agent-common,${EXTEN},1)
exten => _009715XXXXXXXX,1,Goto(from-agent-common,${EXTEN},1)
exten => _0[2-9]XXXXXXX,1,Goto(from-agent-common,${EXTEN},1)
exten => _+971[2-9]XXXXXXX,1,Goto(from-agent-common,${EXTEN},1)
exten => _00971[2-9]XXXXXXX,1,Goto(from-agent-common,${EXTEN},1)

; Internal extension dialing + own-mailbox access stay reachable from
; every tier via `include =>` below — not subject to any of the above.
exten => _1XXX,1,Set(VMBOX=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Goto(vm-${DIALSTATUS},1)
exten => _2XXX,1,Set(VMBOX=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Goto(vm-${DIALSTATUS},1)

exten => vm-NOANSWER,1,Voicemail(${VMBOX}@default,u)
 same => n,Hangup()
exten => vm-BUSY,1,Voicemail(${VMBOX}@default,b)
 same => n,Hangup()
exten => vm-CHANUNAVAIL,1,Voicemail(${VMBOX}@default,u)
 same => n,Hangup()
; Catch-all for DIALSTATUS values that mean the call was already handled
; (ANSWER, CANCEL, CONGESTION, DONTCALL, TORTURE, INVALIDARGS) — nothing to
; do but hang up cleanly rather than falling through to "no matching
; extension".
exten => _vm-.,1,Hangup()

; VoicemailMain access — an agent dials this to check their own mailbox.
; Uses their SIP CallerID(num) to select the mailbox, which only works
; correctly if CallerID(num) is set to the agent's own extension (true for
; the WebRTC/hardware endpoint templates generated by
; src/lib/pjsip-config.ts) — VoicemailMain still prompts for the mailbox +
; PIN if that assumption doesn't hold for some endpoint.
exten => *97,1,Answer()
 same => n,VoicemailMain(${CALLERID(num)}@default)
 same => n,Hangup()

[from-agent-national]
include => from-agent-local
; Adds India — a normal, expected business destination (agents are based
; in India per CLAUDE.md), not a toll-fraud risk, even though it's
; numbering-plan-wise "international" from this UAE-based trunk.
exten => _+91XXXXXXXXXX,1,Goto(from-agent-common,${EXTEN},1)
exten => _0091XXXXXXXXXX,1,Goto(from-agent-common,${EXTEN},1)

[from-agent-international]
include => from-agent-national
; Anything else — INTERNATIONAL-tier extensions only. Still subject to
; the hard premium/satellite block above regardless: those patterns are
; more specific and always win the match, independent of include order.
; _[+0-9]. not _X. so a "+"-prefixed E.164 number is accepted here too.
exten => _[+0-9].,1,Goto(from-agent-common,${EXTEN},1)

; Shared outbound handling (DNC check, jitterbuffer, the actual Dial()) —
; reached only via Goto from whichever tier matched a caller's dialed
; number above, never dialed into directly by an external caller/context.
[from-agent-common]
; Pattern must accept a leading "+" — the tier contexts above match E.164
; forms like _+9715XXXXXXXX and Goto here with EXTEN still carrying the
; "+", but plain _X. only matches [0-9]. so "+971..." fell through to "no
; matching extension" and the call was Declined (603). _[+0-9]. covers
; both the +E.164 and bare-national forms; the "+" is stripped just
; before Dial() (DIALNUM, below).
exten => _[+0-9].,1,NoOp(Outbound Call from Agent, permission-checked: ${EXTEN})
 ; Record the outbound leg too, not just inbound ([from-dinstar] has its
 ; own MixMonitor). Same ${UNIQUEID}.wav filename convention so the CDR
 ; listener (scripts/ami-cdr-listener.ts) computes recordingUrl as
 ; /api/recordings/${UNIQUEID} identically for both directions. Placed
 ; before Dial() so ring/wait time is captured.
 ;
 ; S6: gated by the global recording toggle (func_odbc.conf's
 ; RECORDING_ENABLED, backed by "PbxRuntimeFlag" / POST /api/admin/recording).
 ; FAIL OPEN — REC_FLAG is only "0" when a healthy DB read explicitly says
 ; recording is off; an ODBC/DB failure leaves it empty and we record.
 same => n,Set(REC_FLAG=${RECORDING_ENABLED()})
 same => n,ExecIf($["${REC_FLAG}"!="0"]?MixMonitor(${UNIQUEID}.wav))
 ; Was Set(CALLERID(num)=AlgoCallCenter) — CALLERID(num) is the NUMERIC
 ; caller-id field; a non-numeric string there is malformed SIP `From`
 ; signaling toward the GSM trunk. The Dinstar gateway presents the
 ; inserted SIM's own real number for outbound GSM calls regardless of
 ; what Asterisk sets here, so there is no real DID to set num to — only
 ; the human-readable label (CALLERID(name), which has no numeric-format
 ; requirement) needs setting.
 same => n,Set(CALLERID(name)=Algo Call Center)
 ; Mandatory dialplan-layer Do Not Call check (Phase C) — see
 ; func_odbc.conf's DNC_CHECK definition and its normalization-limitation
 ; caveat, and prisma/schema.prisma's DoNotCallEntry comment for why this
 ; layer exists even though the softphone already checks GET /api/dnc/check
 ; before dialing: a hardware phone or compromised client could skip that.
 ; Fails OPEN (allows the call) if the ODBC lookup itself errors — e.g. if
 ; this Asterisk image lacks ODBC support (see odbc.ini's caveat) — rather
 ; than taking down all outbound calling because of a DNC-infrastructure
 ; problem. That tradeoff (availability over blocking-on-error) should be
 ; revisited with whoever owns compliance sign-off before real production
 ; use; it is not a decision this dialplan should make unilaterally forever.
 same => n,Set(DNC_HIT=${DNC_CHECK(${EXTEN})})
 same => n,GotoIf($["${DNC_HIT}"="1"]?dnc-blocked,1)
 ; S6: recording declaration. Played once the call is cleared to dial,
 ; before the trunk leg. Gated by RECORDING_ANNOUNCE_ENABLED, which is
 ; FORCED ON whenever recording is on (POST /api/admin/recording will not
 ; store announcement=off while recording=on). Skipped ONLY when BOTH
 ; flags read a real "0" — any lookup failure plays the prompt (never
 ; record silently). Prompt file: pbx_configs/sounds/README.md.
 same => n,Set(ANN_FLAG=${RECORDING_ANNOUNCE_ENABLED()})
 same => n,ExecIf($[$["${REC_FLAG}"!="0"]|$["${ANN_FLAG}"!="0"]]?Playback(custom/this-call-may-be-recorded))
 ; De-jitter the outbound leg before it reaches the Dinstar/Tailscale hop.
 ; adaptive with explicit (max,resync,target)=200,80,60 rather than
 ; Asterisk's `default` (40ms target) — this route crosses a WireGuard
 ; overlay (Tailscale) that can fall back to a DERP relay under NAT
 ; failure, at which point RTP inter-arrival jitter routinely exceeds
 ; 60ms; `default`'s tighter target would itself become a source of
 ; audible buffer underruns on that path.
 same => n,Set(JITTERBUFFER(adaptive)=200,80,60)
 ; Strip a leading "+" before handing the number to the Dinstar gateway —
 ; the UC2000's GSM dial-out expects the bare digit string (971544887712
 ; or a national 0-prefixed form per the gateway's own "Number Manipulation"
 ; config), not an E.164 "+". Asterisk's ${EXTEN:1} when EXTEN starts "+".
 same => n,Set(DIALNUM=${IF($["${EXTEN:0:1}"="+"]?${EXTEN:1}:${EXTEN})})
 ; Dropped the trailing `T` flag (was Dial(...,60,T)) — that grants the
 ; EXTERNAL called party the right to initiate an attended transfer on
 ; this channel, a fraud vector with no legitimate use here (transfers
 ; are agent-initiated, from the softphone, never from the far end).
 same => n,Dial(PJSIP/${DIALNUM}@dinstar-trunk,60)
 same => n,Hangup()

exten => dnc-blocked,1,NoOp(Blocked outbound call to ${EXTEN} — on Do Not Call list)
 same => n,Playback(custom/call-cannot-be-completed) ; S6: real prompt — see pbx_configs/sounds/README.md (deploy step)
 same => n,Hangup()

exten => dial-permission-blocked,1,NoOp(Blocked outbound call to ${EXTEN} — outside this extension's permitted destinations, or a hard-blocked premium-rate/satellite range)
 same => n,Playback(custom/call-cannot-be-completed) ; S6: real prompt — see pbx_configs/sounds/README.md (deploy step)
 same => n,Hangup()

[conference]
; Ad-hoc 3-way conference (Phase G). Every leg — the agent's own channel,
; the original bridged party's channel, and the newly Originated third
; party — is moved here (via AMI Redirect for the first two, Originate for
; the third) to join the SAME ConfBridge room by extension number, i.e. the
; conference id IS the dialplan extension here. See
; src/app/api/calls/conference/route.ts for the orchestration and its
; confidence caveats (BridgeId-based peer discovery, WebRTC media
; renegotiation risk).
exten => _X.,1,Answer()
 same => n,ConfBridge(${EXTEN},default_bridge,default_user)
 same => n,Hangup()

[from-dinstar]
; Inbound Call from UAE GSM SIM - Route to Ring Group.
;
; Track C hardening: the Dinstar gateway, once its inbound route is set to
; forward with a fixed called-number (rather than its own two-stage-dial
; IVR — see the plan's Track C), may present the called number as the SIM's
; own MSISDN, a configured DID, or a literal "s", depending on firmware and
; the gateway's "Call Destination" setting. Match ALL of them into the same
; `s` handler so a gateway-config change can never silently drop inbound
; calls with "no matching extension".
exten => _[+0-9].,1,Goto(s,1)
exten => _X.,1,Goto(s,1)

exten => s,1,NoOp(Inbound Call Received from Dinstar Gateway)
 same => n,Answer()
 ; Record the whole call — hold time included, not just the agent leg —
 ; using MixMonitor (not the deprecated Monitor app). Filename keyed by
 ; ${UNIQUEID}, matching CallDetailRecord.uniqueId in prisma/schema.prisma,
 ; so the CDR listener (scripts/ami-cdr-listener.mjs) can compute
 ; recordingUrl as /api/recordings/${UNIQUEID} deterministically without
 ; needing Asterisk to report the filename back explicitly. Lands in
 ; /var/spool/asterisk/monitor, i.e. ./recordings on the host (see
 ; docker-compose.yml's asterisk service volumes).
 ; S6: gated by the global recording toggle (func_odbc.conf's
 ; RECORDING_ENABLED). FAIL OPEN — records unless a healthy DB read
 ; returns a real "0". This is now the ONLY recording start for inbound
 ; calls: queues.conf's `monitor-type = MixMonitor` was removed so the
 ; queue's auto-record can't bypass this toggle (and can't double-record).
 same => n,Set(REC_FLAG=${RECORDING_ENABLED()})
 same => n,ExecIf($["${REC_FLAG}"!="0"]?MixMonitor(${UNIQUEID}.wav))
 ; S6: recording declaration, before the caller enters the queue. Gated by
 ; RECORDING_ANNOUNCE_ENABLED (forced on whenever recording is on); played
 ; on any lookup failure. Prompt file: pbx_configs/sounds/README.md.
 same => n,Set(ANN_FLAG=${RECORDING_ANNOUNCE_ENABLED()})
 same => n,ExecIf($[$["${REC_FLAG}"!="0"]|$["${ANN_FLAG}"!="0"]]?Playback(custom/this-call-may-be-recorded))
 ; Same jitter-buffer rationale as [from-agent-common]'s outbound leg
 ; above — this is the inbound GSM/Tailscale leg, the other side of the
 ; same India<->UAE jitter problem, applied before the caller is bridged
 ; to an agent via the queue.
 same => n,Set(JITTERBUFFER(adaptive)=200,80,60)
 same => n,Queue(support_queue,t,,,300)
 ; Loop D1 — was a bare Hangup() here, meaning every one of Queue()'s
 ; non-answered outcomes (no agents logged in, queue full against the
 ; 4-GSM-port maxlen cap, a mid-wait leaveempty kick) dropped the caller
 ; with silence, then a hangup — no voicemail, no announcement, nothing.
 ; QUEUESTATUS is set by Queue() on every return that isn't a completed
 ; bridge to an agent; route all of them to the shared office mailbox
 ; (voicemail.conf's static 9000 entry) instead of guessing at which
 ; specific outcome occurred.
 same => n,GotoIf($["${QUEUESTATUS}"=""]?hangup,1) ; empty = call WAS answered by an agent; nothing left to do
 same => n,Voicemail(9000@default,u)
 same => n,Goto(hangup,1)

exten => hangup,1,Hangup()
