; ============================================================
; Loop C2 — per-agent dial-permission cascade (toll-fraud guard).
;
; BEFORE this, [from-agent] matched a bare `_X.` — ANY number an agent's
; softphone dialed, no restriction at all. Since a SIP secret lives in the
; agent's browser memory (src/lib/pjsip-config.ts's generated endpoints),
; a compromised session could dial premium-rate/satellite numbers freely —
; the classic toll-fraud vector. Extension.dialPermission (Prisma,
; LOCAL|NATIONAL|INTERNATIONAL, default LOCAL) now selects which of the
; three contexts below a generated endpoint's `context=` points at.
;
; CONFIDENCE: MEDIUM on the exact prefix patterns below — real UAE/India
; numbering-plan conventions, but not independently re-verified against a
; live trunk by a telecom specialist. Same honesty standard this repo
; already applies to func_odbc.conf's DNC normalization gap: verify/tighten
; with whoever owns telecom cost before trusting this as the SOLE
; toll-fraud control. Also inherits that same gap's root limitation — EXTEN
; here is whatever the softphone dialed as-is (dialpad.tsx sends raw
; digits), NOT run through phone-normalize.ts's E.164 normalization (the
; dialplan can't call a TypeScript function) — this only reliably matches
; the dialing conventions actually used against this trunk.
;
; Hard-blocked prefixes (satellite: Inmarsat/Thuraya/Iridium; known
; international premium-rate ranges) are declared ONCE, in the base
; [from-agent-local] context, and are MORE SPECIFIC (fixed-prefix, no
; trailing `_X.` bucket) than every "allow" pattern in every tier —
; Asterisk always resolves to the single best/most-specific match across a
; context's own patterns and everything it includes, so a wider
; permission tier cannot bypass this by definition, not just by ordering.
; This list is representative, NOT exhaustive.
; ============================================================

[from-agent-local]
; Emergency-number policy (see this repo's GO_LIVE_CHECKLIST.md Gate 4):
; agents dial from India, but this PBX's only outbound
; trunk is a UAE GSM SIM (see CLAUDE.md's hard constraints) — a PBX-dialed
; "emergency" number would reach UAE emergency services, not India's,
; regardless of where the agent physically is. There is no correct way
; for this system to route a real emergency call, so misdials are blocked
; outright rather than silently connecting to the wrong country's
; responders; the operator runbook must tell agents to use their own
; mobile for any real emergency. Exact-match (not prefix) so this can
; never accidentally swallow a real destination.
exten => 999,1,Goto(from-agent-common,dial-permission-blocked,1)   ; UAE police
exten => 998,1,Goto(from-agent-common,dial-permission-blocked,1)   ; UAE ambulance
exten => 997,1,Goto(from-agent-common,dial-permission-blocked,1)   ; UAE civil defense (fire)
exten => 112,1,Goto(from-agent-common,dial-permission-blocked,1)   ; EU/GSM-standard emergency
exten => 911,1,Goto(from-agent-common,dial-permission-blocked,1)   ; NANP emergency
exten => 100,1,Goto(from-agent-common,dial-permission-blocked,1)   ; India police
exten => 101,1,Goto(from-agent-common,dial-permission-blocked,1)   ; India fire
exten => 102,1,Goto(from-agent-common,dial-permission-blocked,1)   ; India ambulance
exten => 108,1,Goto(from-agent-common,dial-permission-blocked,1)   ; India emergency (some states)

exten => _+870.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00870.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+871.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00871.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+872.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00872.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+873.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00873.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+874.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00874.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+881.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00881.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+882.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00882.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+883.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00883.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _+888.,1,Goto(from-agent-common,dial-permission-blocked,1)
exten => _00888.,1,Goto(from-agent-common,dial-permission-blocked,1)

; UAE mobile (05X + 8 digits, or +9715X / 009715X form) and landline
; (area code 2-9 + 7 digits, or +971[2-9] / 00971[2-9] form) — the base
; tier every extension gets by default.
exten => _05XXXXXXXX,1,Goto(from-agent-common,${EXTEN},1)
exten => _+9715XXXXXXXX,1,Goto(from-agent-common,${EXTEN},1)
exten => _009715XXXXXXXX,1,Goto(from-agent-common,${EXTEN},1)
exten => _0[2-9]XXXXXXX,1,Goto(from-agent-common,${EXTEN},1)
exten => _+971[2-9]XXXXXXX,1,Goto(from-agent-common,${EXTEN},1)
exten => _00971[2-9]XXXXXXX,1,Goto(from-agent-common,${EXTEN},1)

; Internal extension dialing + own-mailbox access stay reachable from
; every tier via `include =>` below — not subject to any of the above.
; Hybrid AI + Human plan (LLM.md decision, 2026-09-14) — an AI-kind
; Extension (Extension.agentType="AI") has no sipSecret/registration, so
; Dial(PJSIP/${EXTEN},...) below would just fail CHANUNAVAIL/NOANSWER for
; one of these numbers. AI_EXTENSION_CHECK (func_odbc.conf) looks the
; dialed number up against Extension+AiAgent; a healthy "1" sends the call
; to [ai-agent-internal] (AudioSocket) instead of PJSIP Dial. Any lookup
; failure/empty result falls straight through to the existing Dial() line
; unchanged — same fail-*-to-existing-behavior pattern as the
; RECORDING_ENABLED()/DNC_CHECK() gates elsewhere in this file. Lets a human
; agent transfer a live call to an AI agent, or dial one directly, the same
; way they'd reach another human extension.
exten => _1XXX,1,Set(VMBOX=${EXTEN})
 same => n,Set(AI_HIT=${AI_EXTENSION_CHECK(${EXTEN})})
 same => n,GotoIf($["${AI_HIT}"="1"]?ai-agent-internal,${EXTEN},1)
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Goto(vm-${DIALSTATUS},1)
exten => _2XXX,1,Set(VMBOX=${EXTEN})
 same => n,Set(AI_HIT=${AI_EXTENSION_CHECK(${EXTEN})})
 same => n,GotoIf($["${AI_HIT}"="1"]?ai-agent-internal,${EXTEN},1)
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Goto(vm-${DIALSTATUS},1)

exten => vm-NOANSWER,1,Voicemail(${VMBOX}@default,u)
 same => n,Hangup()
exten => vm-BUSY,1,Voicemail(${VMBOX}@default,b)
 same => n,Hangup()
exten => vm-CHANUNAVAIL,1,Voicemail(${VMBOX}@default,u)
 same => n,Hangup()
; Catch-all for DIALSTATUS values that mean the call was already handled
; (ANSWER, CANCEL, CONGESTION, DONTCALL, TORTURE, INVALIDARGS) — nothing to
; do but hang up cleanly rather than falling through to "no matching
; extension".
exten => _vm-.,1,Hangup()

; VoicemailMain access — an agent dials this to check their own mailbox.
; Uses their SIP CallerID(num) to select the mailbox, which only works
; correctly if CallerID(num) is set to the agent's own extension (true for
; the WebRTC/hardware endpoint templates generated by
; src/lib/pjsip-config.ts) — VoicemailMain still prompts for the mailbox +
; PIN if that assumption doesn't hold for some endpoint.
exten => *97,1,Answer()
 same => n,VoicemailMain(${CALLERID(num)}@default)
 same => n,Hangup()

[from-agent-national]
include => from-agent-local
; Adds India — a normal, expected business destination (agents are based
; in India per CLAUDE.md), not a toll-fraud risk, even though it's
; numbering-plan-wise "international" from this UAE-based trunk.
exten => _+91XXXXXXXXXX,1,Goto(from-agent-common,${EXTEN},1)
exten => _0091XXXXXXXXXX,1,Goto(from-agent-common,${EXTEN},1)

[from-agent-international]
include => from-agent-national
; Anything else — INTERNATIONAL-tier extensions only. Still subject to
; the hard premium/satellite block above regardless: those patterns are
; more specific and always win the match, independent of include order.
; _[+0-9]. not _X. so a "+"-prefixed E.164 number is accepted here too.
exten => _[+0-9].,1,Goto(from-agent-common,${EXTEN},1)

; Shared outbound handling (DNC check, jitterbuffer, the actual Dial()) —
; reached only via Goto from whichever tier matched a caller's dialed
; number above, never dialed into directly by an external caller/context.
[from-agent-common]
; Pattern must accept a leading "+" — the tier contexts above match E.164
; forms like _+9715XXXXXXXX and Goto here with EXTEN still carrying the
; "+", but plain _X. only matches [0-9]. so "+971..." fell through to "no
; matching extension" and the call was Declined (603). _[+0-9]. covers
; both the +E.164 and bare-national forms; the "+" is stripped just
; before Dial() (DIALNUM, below).
exten => _[+0-9].,1,NoOp(Outbound Call from Agent, permission-checked: ${EXTEN})
 ; Record the outbound leg too, not just inbound ([from-dinstar] has its
 ; own MixMonitor). Same ${UNIQUEID}.wav filename convention so the CDR
 ; listener (scripts/ami-cdr-listener.ts) computes recordingUrl as
 ; /api/recordings/${UNIQUEID} identically for both directions. Placed
 ; before Dial() so ring/wait time is captured.
 ;
 ; S6: gated by the global recording toggle (func_odbc.conf's
 ; RECORDING_ENABLED, backed by "PbxRuntimeFlag" / POST /api/admin/recording).
 ; FAIL OPEN — REC_FLAG is only "0" when a healthy DB read explicitly says
 ; recording is off; an ODBC/DB failure leaves it empty and we record.
 same => n,Set(REC_FLAG=${RECORDING_ENABLED()})
 same => n,ExecIf($["${REC_FLAG}"!="0"]?MixMonitor(${UNIQUEID}.wav))
 ; Was Set(CALLERID(num)=AlgoCallCenter) — CALLERID(num) is the NUMERIC
 ; caller-id field; a non-numeric string there is malformed SIP `From`
 ; signaling toward the GSM trunk. The Dinstar gateway presents the
 ; inserted SIM's own real number for outbound GSM calls regardless of
 ; what Asterisk sets here, so there is no real DID to set num to — only
 ; the human-readable label (CALLERID(name), which has no numeric-format
 ; requirement) needs setting.
 same => n,Set(CALLERID(name)=Algo Call Center)
 ; Mandatory dialplan-layer Do Not Call check (Phase C) — see
 ; func_odbc.conf's DNC_CHECK definition and its normalization-limitation
 ; caveat, and prisma/schema.prisma's DoNotCallEntry comment for why this
 ; layer exists even though the softphone already checks GET /api/dnc/check
 ; before dialing: a hardware phone or compromised client could skip that.
 ; Fails OPEN (allows the call) if the ODBC lookup itself errors — e.g. if
 ; this Asterisk image lacks ODBC support (see odbc.ini's caveat) — rather
 ; than taking down all outbound calling because of a DNC-infrastructure
 ; problem. That tradeoff (availability over blocking-on-error) should be
 ; revisited with whoever owns compliance sign-off before real production
 ; use; it is not a decision this dialplan should make unilaterally forever.
 same => n,Set(DNC_HIT=${DNC_CHECK(${EXTEN})})
 same => n,GotoIf($["${DNC_HIT}"="1"]?dnc-blocked,1)
 ; S6: recording declaration. Played once the call is cleared to dial,
 ; before the trunk leg. Gated by RECORDING_ANNOUNCE_ENABLED, which is
 ; FORCED ON whenever recording is on (POST /api/admin/recording will not
 ; store announcement=off while recording=on). Skipped ONLY when BOTH
 ; flags read a real "0" — any lookup failure plays the prompt (never
 ; record silently). Prompt file: pbx_configs/sounds/README.md.
 same => n,Set(ANN_FLAG=${RECORDING_ANNOUNCE_ENABLED()})
 same => n,ExecIf($[$["${REC_FLAG}"!="0"]|$["${ANN_FLAG}"!="0"]]?Playback(custom/this-call-may-be-recorded))
 ; De-jitter the outbound leg before it reaches the Dinstar/Tailscale hop.
 ; adaptive with explicit (max,resync,target)=200,80,60 rather than
 ; Asterisk's `default` (40ms target) — this route crosses a WireGuard
 ; overlay (Tailscale) that can fall back to a DERP relay under NAT
 ; failure, at which point RTP inter-arrival jitter routinely exceeds
 ; 60ms; `default`'s tighter target would itself become a source of
 ; audible buffer underruns on that path.
 same => n,Set(JITTERBUFFER(adaptive)=200,80,60)
 ; Strip a leading "+" before handing the number to the Dinstar gateway —
 ; the UC2000's GSM dial-out expects the bare digit string (971544887712
 ; or a national 0-prefixed form per the gateway's own "Number Manipulation"
 ; config), not an E.164 "+". Asterisk's ${EXTEN:1} when EXTEN starts "+".
 same => n,Set(DIALNUM=${IF($["${EXTEN:0:1}"="+"]?${EXTEN:1}:${EXTEN})})
 ; Dropped the trailing `T` flag (was Dial(...,60,T)) — that grants the
 ; EXTERNAL called party the right to initiate an attended transfer on
 ; this channel, a fraud vector with no legitimate use here (transfers
 ; are agent-initiated, from the softphone, never from the far end).
 same => n,Dial(PJSIP/${DIALNUM}@dinstar-trunk,60)
 same => n,Hangup()

exten => dnc-blocked,1,NoOp(Blocked outbound call to ${EXTEN} — on Do Not Call list)
 same => n,Playback(custom/call-cannot-be-completed) ; S6: real prompt — see pbx_configs/sounds/README.md (deploy step)
 same => n,Hangup()

exten => dial-permission-blocked,1,NoOp(Blocked outbound call to ${EXTEN} — outside this extension's permitted destinations, or a hard-blocked premium-rate/satellite range)
 same => n,Playback(custom/call-cannot-be-completed) ; S6: real prompt — see pbx_configs/sounds/README.md (deploy step)
 same => n,Hangup()

; ============================================================
; Hybrid AI + Human plan (LLM.md decision, 2026-09-14) — internal handoff
; to an AI agent. Reached only via Goto from [from-agent-local]'s _1XXX/
; _2XXX internal-dial handlers above once AI_EXTENSION_CHECK() confirms the
; dialed number is an AI-kind Extension — never dialed into directly by an
; external caller/context, same reachable-only-via-Goto convention as
; [from-agent-common]/[conference] elsewhere in this file.
;
; AudioSocket(${UNIQUEID},127.0.0.1:9092) hands the call's audio to the
; ai-voice-agent sidecar (ai-voice-agent/, W4's Python service, wired in
; docker-compose.yml with network_mode: host so it can reach this same
; 127.0.0.1:9092 Asterisk is listening on) — see
; .agents/hybrid-ai/contracts.md for the fixed 9092 (audio)/9091 (HTTP
; pre-registration) port contract. AMI-only stays intact: this is a plain
; dialplan application, not ARI/Stasis.
; ============================================================
[ai-agent-internal]
exten => _.,1,NoOp(AI-handled internal call, exten=${EXTEN})
 ; Post-verification fix round, finding #1 (CRITICAL — dead air): before
 ; this line, AudioSocket() connected to the sidecar with NO prior call to
 ; its pre-registration HTTP endpoint (port 9091, POST /register). main.py's
 ; AudioSocket handler looks up the call's UUID in a PendingCall registry
 ; populated ONLY by /register — with nothing registered, it logs a warning
 ; and does nothing: no greeting, no audio, dead air until hangup. This
 ; CURL() call registers the call (extension + tenant + UUID) BEFORE
 ; Answer()/AudioSocket() so the sidecar has AiAgentConfigResponse ready the
 ; moment the AudioSocket TCP connection arrives. Requires func_curl.so
 ; (CURL() dialplan function, needs res_curl.so loaded) — NOT verified
 ; loaded here since modules.conf is outside this fix round's file list;
 ; if `core show application CURL` reports "not found" on this Asterisk
 ; image, add `load => res_curl.so` / `load => func_curl.so` to
 ; modules.conf before this works.
 ;
 ; AI_TENANT_ID: this internal-transfer path (_1XXX/_2XXX in
 ; [from-agent-local]) is reached by an already-authenticated PJSIP agent
 ; channel, so PJSIP_HEADER/endpoint identity is available in principle —
 ; but this schema has no per-call tenant channel variable set anywhere
 ; upstream of this Goto today. Passing empty here, same
 ; flagged-not-hidden convention this file already uses for the
 ; AI_INBOUND_EXTENSION() single-tenant limitation above. main.py's
 ; /register + agent-config fetch must tolerate an empty tenant_id (single-
 ; tenant AI deployment only) until real per-call tenant propagation exists.
 ;
 ; main.py's PreRegistrationServer.handle_register does json.loads(body) —
 ; CURL()'s post-data argument is sent verbatim (Asterisk does not
 ; auto-urlencode it), so a literal JSON string plus an explicit
 ; Content-Type header produces exactly the body shape handle_register
 ; expects: {"call_uuid","extension","tenant_id"}. Commas inside a dialplan
 ; function argument must be backslash-escaped or Asterisk parses them as
 ; extra CURL() arguments. x-internal-secret matches main.py's
 ; _is_authorized_prereg_request()/AI_SIDECAR_SHARED_SECRET check.
 ; ${ENV(AI_SIDECAR_SHARED_SECRET)} reads it straight from the Asterisk
 ; process's own environment (docker-compose.yml's `asterisk` service has
 ; `env_file: .env`, same file AI_SIDECAR_SHARED_SECRET is already defined
 ; in for the `ai-voice-agent` and `web` services) — no [globals] entry
 ; needed. If the Asterisk image's build strips ENV() (func_env.so), this
 ; silently resolves empty and the sidecar's fail-closed 401 check catches
 ; the mismatch rather than the call failing invisibly.
 same => n,Set(CURLOPT(httpheader)=Content-Type: application/json)
 same => n,Set(CURLOPT(httpheader)=x-internal-secret: ${ENV(AI_SIDECAR_SHARED_SECRET)})
 same => n,Set(AI_REG=${CURL(http://127.0.0.1:9091/register,{"call_uuid":"${UNIQUEID}"\,"extension":"${EXTEN}"\,"tenant_id":"${AI_TENANT_ID}"})})
 same => n,Answer()
 same => n,AudioSocket(${UNIQUEID},127.0.0.1:9092)
 same => n,Hangup()

[conference]
; Ad-hoc 3-way conference (Phase G). Every leg — the agent's own channel,
; the original bridged party's channel, and the newly Originated third
; party — is moved here (via AMI Redirect for the first two, Originate for
; the third) to join the SAME ConfBridge room by extension number, i.e. the
; conference id IS the dialplan extension here. See
; src/app/api/calls/conference/route.ts for the orchestration and its
; confidence caveats (BridgeId-based peer discovery, WebRTC media
; renegotiation risk).
exten => _X.,1,Answer()
 same => n,ConfBridge(${EXTEN},default_bridge,default_user)
 same => n,Hangup()

[from-dinstar]
; Inbound Call from UAE GSM SIM - Route to Ring Group.
;
; Track C hardening: the Dinstar gateway, once its inbound route is set to
; forward with a fixed called-number (rather than its own two-stage-dial
; IVR — see the plan's Track C), may present the called number as the SIM's
; own MSISDN, a configured DID, or a literal "s", depending on firmware and
; the gateway's "Call Destination" setting. Match ALL of them into the same
; `s` handler so a gateway-config change can never silently drop inbound
; calls with "no matching extension".
exten => _[+0-9].,1,Goto(s,1)
exten => _X.,1,Goto(s,1)

exten => s,1,NoOp(Inbound Call Received from Dinstar Gateway)
 same => n,Answer()
 ; Record the whole call — hold time included, not just the agent leg —
 ; using MixMonitor (not the deprecated Monitor app). Filename keyed by
 ; ${UNIQUEID}, matching CallDetailRecord.uniqueId in prisma/schema.prisma,
 ; so the CDR listener (scripts/ami-cdr-listener.mjs) can compute
 ; recordingUrl as /api/recordings/${UNIQUEID} deterministically without
 ; needing Asterisk to report the filename back explicitly. Lands in
 ; /var/spool/asterisk/monitor, i.e. ./recordings on the host (see
 ; docker-compose.yml's asterisk service volumes).
 ; S6: gated by the global recording toggle (func_odbc.conf's
 ; RECORDING_ENABLED). FAIL OPEN — records unless a healthy DB read
 ; returns a real "0". This is now the ONLY recording start for inbound
 ; calls: queues.conf's `monitor-type = MixMonitor` was removed so the
 ; queue's auto-record can't bypass this toggle (and can't double-record).
 same => n,Set(REC_FLAG=${RECORDING_ENABLED()})
 same => n,ExecIf($["${REC_FLAG}"!="0"]?MixMonitor(${UNIQUEID}.wav))
 ; S6: recording declaration, before the caller enters the queue. Gated by
 ; RECORDING_ANNOUNCE_ENABLED (forced on whenever recording is on); played
 ; on any lookup failure. Prompt file: pbx_configs/sounds/README.md.
 same => n,Set(ANN_FLAG=${RECORDING_ANNOUNCE_ENABLED()})
 same => n,ExecIf($[$["${REC_FLAG}"!="0"]|$["${ANN_FLAG}"!="0"]]?Playback(custom/this-call-may-be-recorded))
 ; Same jitter-buffer rationale as [from-agent-common]'s outbound leg
 ; above — this is the inbound GSM/Tailscale leg, the other side of the
 ; same India<->UAE jitter problem, applied before the caller is bridged
 ; to an agent via the queue.
 same => n,Set(JITTERBUFFER(adaptive)=200,80,60)
 ; Caller-ID routing rules (2026-09-14, independently designed — see
 ; func_odbc.conf's [CALLER_ROUTING_ACTION] header and
 ; prisma/schema.prisma's CallerRoutingRule model). Consulted BEFORE the AI
 ; routing decision below, so an admin's "always human" / "always refuse"
 ; rule for a specific caller overrides whatever the AI port lookup would
 ; otherwise decide. Empty ROUTING_ACTION (no rule matched) falls straight
 ; through to the unchanged AI/queue logic below — same
 ; fail-to-existing-behavior convention as every other ODBC check in this
 ; file. Answer()/MixMonitor/the recording announcement above still run for
 ; a BLOCKed caller before they're hung up on — same as any other call
 ; through this shared `s` extension, not a special early reject.
 same => n,Set(ROUTING_ACTION=${CALLER_ROUTING_ACTION(${CALLERID(num)})})
 same => n,GotoIf($["${ROUTING_ACTION}"="BLOCK"]?hangup,1)
 same => n,GotoIf($["${ROUTING_ACTION}"="PASS"]?force-queue)
 ; Hybrid AI + Human plan (LLM.md decision, 2026-09-14) — premium tenants
 ; can route inbound calls to an AI agent instead of the human queue.
 ; AI_INBOUND_EXTENSION() (func_odbc.conf) looks up whether there's an
 ; enabled AI-kind Extension (Extension.agentType="AI" + AiAgent.enabled)
 ; that should take this call; empty/lookup-failure falls straight through
 ; to the unchanged Queue() line below — same fail-to-existing-behavior
 ; convention as RECORDING_ENABLED()/DNC_CHECK() above, so a broken ODBC
 ; lookup degrades to "route to the human queue like always", never a
 ; silently-broken inbound path.
 ;
 ; ⚠️ Follow-up to §34 (LLM.md, 2026-09-14) — GENUINELY UNVERIFIED, flagged
 ; not hidden: AI_INBOUND_EXTENSION() now resolves an AI agent per Dinstar
 ; GSM port (AiAgent.dinstarPort, 1-4, matching WaInstance.simPort's
 ; numbering), which is what lets more than one AI agent be live on this
 ; Asterisk instance at once (one per port) instead of the old single-
 ; globally-enabled-agent limit. That per-port lookup is only correct if
 ; DINSTAR_PORT below actually carries the real port a given call arrived
 ; on — and today it CANNOT: LLM.md §25.1 found the gateway's Tel->IP
 ; Routing pointed Port Group-0 (spanning all 4 physical ports) at one
 ; shared trunk/AOR, so nothing distinguishing one port from another is
 ; currently visible to Asterisk's dialplan for this shared-trunk call.
 ; Left empty rather than inventing a fake extraction that would look
 ; confirmed when it isn't (e.g. parsing a port hint out of
 ; CHANNEL(pjsip,remote_uri) — there is no live evidence the gateway puts
 ; one there for this trunk). An empty DINSTAR_PORT makes
 ; AI_INBOUND_EXTENSION()'s dinstarPort comparison match nothing, which
 ; correctly falls through to the Queue() below — same
 ; fail-to-existing-behavior convention as everywhere else in this file.
 ;
 ; Making this real requires one of:
 ;   (a) reconfiguring the gateway's PortCfg/SipAccN (per LLM.md §25.1's
 ;       mapped HTTP API — POST /goform/PortCfg, fields SipAccN/
 ;       AuthenticateIDN/SipAccPswN/SipLocalPortN/RegisterN per port 0-7,
 ;       i.e. dinstarPort-1 in the gateway's own 0-indexed API — same
 ;       off-by-one src/lib/messaging/dinstar-sms-provider.ts's
 ;       simPortToApiPort() already uses) so each port registers as its own
 ;       distinct SIP identity/AOR and lands in Asterisk via a distinct
 ;       endpoint or context instead of one shared trunk, or
 ;   (b) a live trace of what the gateway actually sends per port on the
 ;       CURRENT shared-trunk config (SDP/From-header/custom header) to see
 ;       if a port hint is already present and just unused today.
 ; Neither has been done — this TODO is that decision point, not a fix.
 same => n,Set(DINSTAR_PORT=)
 same => n,Set(AI_INBOUND_EXT=${AI_INBOUND_EXTENSION(${DINSTAR_PORT})})
 same => n,GotoIf($["${AI_INBOUND_EXT}"!=""]?from-dinstar-ai,${EXTEN},1)
 ; force-queue: the CALLER_ROUTING_ACTION="PASS" jump target above — an
 ; explicit "always a human" rule skips the AI check entirely and lands
 ; here directly, same Queue() call every other inbound path already uses.
 same => n(force-queue),Queue(support_queue,t,,,300)
 ; Loop D1 — was a bare Hangup() here, meaning every one of Queue()'s
 ; non-answered outcomes (no agents logged in, queue full against the
 ; 4-GSM-port maxlen cap, a mid-wait leaveempty kick) dropped the caller
 ; with silence, then a hangup — no voicemail, no announcement, nothing.
 ; QUEUESTATUS is set by Queue() on every return that isn't a completed
 ; bridge to an agent; route all of them to the shared office mailbox
 ; (voicemail.conf's static 9000 entry) instead of guessing at which
 ; specific outcome occurred.
 same => n,GotoIf($["${QUEUESTATUS}"=""]?hangup,1) ; empty = call WAS answered by an agent; nothing left to do
 same => n,Voicemail(9000@default,u)
 same => n,Goto(hangup,1)

exten => hangup,1,Hangup()

; ============================================================
; Hybrid AI + Human plan (LLM.md decision, 2026-09-14) — premium plan
; inbound AI handling. Reached only via Goto from [from-dinstar]'s `s`
; extension above, once AI_INBOUND_EXTENSION() (func_odbc.conf) confirms an
; enabled AI-kind Extension should take this call — never dialed into
; directly by the Dinstar gateway itself, same reachable-only-via-Goto
; convention as [from-agent-common]/[conference]/[ai-agent-internal]
; elsewhere in this file. Recording/announcement/jitterbuffer already ran
; in [from-dinstar]'s `s` extension before this Goto, so they are NOT
; repeated here.
;
; AudioSocket(${UNIQUEID},127.0.0.1:9092) — Asterisk 20's app_audiosocket
; syntax is AudioSocket(<uuid>,<host:port>): a UUID identifying the call to
; the AudioSocket peer (${UNIQUEID}, matching this file's existing
; CallDetailRecord.uniqueId convention used for MixMonitor filenames) and
; the TCP address the AudioSocket service is listening on. Confirmed
; against Asterisk 20's Application_AudioSocket documentation
; (docs.asterisk.org) — NOT independently re-verified against a live
; instance in this repo, same confidence caveat this file already applies
; to func_odbc.conf's DNC_CHECK/RECORDING_ENABLED syntax. 127.0.0.1:9092 is
; the fixed audio port from .agents/hybrid-ai/contracts.md — do not
; renumber; the ai-voice-agent sidecar (W4's Python service, this node's
; docker-compose.yml wiring) binds it with network_mode: host specifically
; so this loopback address resolves to the same host Asterisk runs on (the
; hard network_mode: host constraint, CLAUDE.md/LLM.md §2). Plain dialplan
; application — no ARI/Stasis involved, AMI-only stays intact.
; ============================================================
[from-dinstar-ai]
exten => _.,1,NoOp(AI-handled inbound call from Dinstar, exten=${EXTEN})
 ; Post-verification fix round, finding #1 (CRITICAL — dead air): same gap
 ; as [ai-agent-internal] above — AudioSocket() was reached with no prior
 ; pre-registration, so main.py's AudioSocket handler finds nothing in its
 ; PendingCall registry, logs a warning, and does nothing (dead air until
 ; hangup). This CURL() call registers the call before Answer()/
 ; AudioSocket(), same JSON-body/header shape as [ai-agent-internal]'s (see
 ; that context's comment for the full CURL()-vs-json.loads() reasoning and
 ; the func_curl.so/res_curl.so load caveat).
 ;
 ; extension=${EXTEN}: this is [from-dinstar]'s `s`-extension GotoIf
 ; target, i.e. EXTEN is whatever the Dinstar gateway presented as the
 ; called number (often literal "s", see that context's own header comment
 ; on called-number ambiguity), NOT necessarily the resolved AI extension
 ; number. AI_INBOUND_EXT (the actual matched Extension.number, set by
 ; AI_INBOUND_EXTENSION() in the caller) is what config_client.py needs to
 ; look up the right AiAgentConfig, so it — not ${EXTEN} — is passed here.
 ;
 ; tenant_id: [from-dinstar] has NO per-DID/per-tenant routing today (see
 ; that context's own "Follow-up to §34" comment) — there is genuinely no
 ; tenant identifier available at this point in the dialplan, not just an
 ; oversight. Passing empty; main.py/config_client.py must tolerate an
 ; empty tenant_id here. Follow-up to §34 (2026-09-14): AI_INBOUND_EXT is
 ; now resolved per-Dinstar-port (AiAgent.dinstarPort), not globally, so
 ; more than one tenant's AI agent CAN be live at once here in principle —
 ; but that per-port resolution genuinely cannot fire yet (DINSTAR_PORT is
 ; empty, see the caller's comment), so in practice this path still behaves
 ; exactly like the old single-agent-only model until the port signal is
 ; real. Revisit once real per-DID tenant routing AND live per-port
 ; DINSTAR_PORT both exist.
 same => n,Set(CURLOPT(httpheader)=Content-Type: application/json)
 same => n,Set(CURLOPT(httpheader)=x-internal-secret: ${ENV(AI_SIDECAR_SHARED_SECRET)})
 same => n,Set(AI_REG=${CURL(http://127.0.0.1:9091/register,{"call_uuid":"${UNIQUEID}"\,"extension":"${AI_INBOUND_EXT}"\,"tenant_id":""})})
 same => n,Answer()
 same => n,AudioSocket(${UNIQUEID},127.0.0.1:9092)
 same => n,Hangup()

; ============================================================
; AI -> HUMAN 3-WAY ESCALATION (LLM.md §34.2, 2026-09-14)
;
; Reached ONLY via AMI from src/app/api/internal/ai/escalate/route.ts's
; `merge` action — never dialed into directly by the Dinstar gateway or an
; agent, same reachable-only-via-Goto/AMI convention as [conference] and
; [ai-agent-internal] above.
;
; Deliberately a SEPARATE context from [conference] (see that context's own
; header, above `[from-dinstar]`): that one is the human-driven ad-hoc 3-way
; (manager-merge / conference API routes) using 4-digit random room ids and
; the shared default_user/default_bridge ConfBridge profiles. This one needs
; per-role profiles (marked vs end_marked — see confbridge.conf's
; [ai_conf_marked]/[ai_conf_bot]) that [conference] must not inherit, and a
; 7-digit room-id space (9XXXXXX) that can never collide with [conference]'s
; 4-digit ids.
; ============================================================
[ai-conference]
; The caller (AMI Redirect) and the human agent (AMI Originate) both land
; here as MARKED users (ai_conf_marked profile) - the AI's own leg
; (ai_conf_bot profile, joined first via [ai-conference-leg] below) leaves
; automatically once the last marked user hangs up, via ConfBridge's
; end_marked mechanism - see confbridge.conf, no AMI/application code
; involved in that tear-down.
;
; NO MixMonitor here, on purpose: the caller's recording was already
; started once, in [from-dinstar]'s `s` extension before this call was ever
; escalated, and MixMonitor follows the channel through an AMI Redirect -
; adding a second one here would double-record the same call.
exten => _9XXXXXX,1,NoOp(AI escalation conference ${EXTEN})
 same => n,Answer()
 same => n,ConfBridge(${EXTEN},ai_conf_bridge,ai_conf_marked)
 same => n,Hangup()

; ---- The AI's own media leg for an escalation conference ----
; Originated by escalate/route.ts as Local/ai@ai-conference-leg/n with
; Context=ai-conference/Exten=<confId>: the ;1 half of that Local channel is
; what gets delivered into the ConfBridge above once it answers; this `ai`
; extension is what the ;2 half executes, and is what actually holds the
; AudioSocket connection back to the sidecar. Two-way audio flows
; caller/human <-> ConfBridge <-> Local;1 <-> Local;2 <-> sidecar.
;
; Answer() BEFORE AudioSocket() is NOT cosmetic ordering: a dialplan
; Originate's ;1 half is only delivered to its Context/Exten once the ;2
; half this extension runs actually answers - reversing this order would
; leave the Originate hanging until [conference]'s own gate/timeout, not
; produce merely-delayed audio.
;
; AI_CONF_UUID/AI_RESUME_OF/AI_TENANT_ID/AI_EXTENSION_NUMBER all come from
; the Originate action's `Variable:` field (set by escalate/route.ts), NOT
; ${UNIQUEID} - this AudioSocket connection is RESUMING an existing sidecar
; session (see ai-voice-agent/main.py's LiveSession/resume_of handling), so
; its id has to be one the sidecar is told to expect explicitly, not a
; fresh id minted for a brand-new call the way [ai-agent-internal]/
; [from-dinstar-ai] mint ${UNIQUEID}.
;
; ARCHITECTURE NOTE (found implementing escalate/route.ts, corrected from
; the original plan sketch): this context DOES pre-register itself via
; CURL(), the same mechanism [ai-agent-internal]/[from-dinstar-ai] above
; use - Next.js does NOT POST directly to the sidecar's :9091/register.
; Reason: `web` runs on the bridge network (docker-compose.yml), not
; network_mode: host like this Asterisk container and the sidecar both do,
; and the sidecar's pre-registration server is deliberately bound to
; 127.0.0.1 only (a prior security fix - see ai-voice-agent/main.py's own
; comment on why 0.0.0.0 there would be a public-internet exposure) - so
; `web` has no reachable address for it at all. Asterisk itself IS
; host-networked, so its own CURL() to 127.0.0.1:9091 works exactly like it
; already does in the two contexts above; this context just carries
; resume_of/role in the CURL() body in addition to the usual three fields.
;
; TIMEOUT(absolute): belt-and-braces backstop. ConfBridge's end_marked
; mechanism (confbridge.conf) is what's SUPPOSED to end this leg the moment
; the last marked (caller/human) user hangs up, but that requires at least
; one marked user to have joined first - if the caller hangs up between the
; Originate and the Redirect (escalate/route.ts's ordering), end_marked
; never fires because no marked user was ever present to leave. One hour is
; far longer than any legitimate escalated call; escalate/route.ts also
; issues a best-effort AMI Hangup on that specific failure path.
[ai-conference-leg]
exten => ai,1,NoOp(AI conference media leg uuid=${AI_CONF_UUID} resume_of=${AI_RESUME_OF})
 same => n,Set(TIMEOUT(absolute)=3600)
 same => n,Set(CURLOPT(httpheader)=Content-Type: application/json)
 same => n,Set(CURLOPT(httpheader)=x-internal-secret: ${ENV(AI_SIDECAR_SHARED_SECRET)})
 same => n,Set(AI_REG=${CURL(http://127.0.0.1:9091/register,{"call_uuid":"${AI_CONF_UUID}"\,"extension":"${AI_EXTENSION_NUMBER}"\,"tenant_id":"${AI_TENANT_ID}"\,"resume_of":"${AI_RESUME_OF}"\,"role":"conference"})})
 same => n,Answer()
 same => n,AudioSocket(${AI_CONF_UUID},127.0.0.1:9092)
 same => n,Hangup()

; ---- Escalation fallback: no assigned target, or capacity-blocked ----
; The missing bare "enter the queue" extension this dialplan never had:
; [from-dinstar]'s own `s` extension already starts a MixMonitor (see that
; context) before ever reaching Queue(), so re-Redirecting an
; already-recording channel back into [from-dinstar],s would start a SECOND
; MixMonitor on the same channel - a double recording, not a no-op. This
; context is Queue()+QUEUESTATUS handling ONLY, nothing else, for a channel
; that has already been answered/recorded once upstream.
;
; NOTE (LLM.md §34.2's plan, "Risks" section): a Redirect into this context
; is a PLAIN handoff, not a 3-way - Queue() bridges the caller directly to
; whichever agent answers, so the AI cannot remain present here the way it
; does in [ai-conference] above. escalate/route.ts only uses this path when
; there is no usable 3-way target (no assigned extension/number, or the GSM
; capacity guard blocked a NUMBER target) - see that route's `check` action.
[ai-queue-fallback]
exten => s,1,NoOp(AI escalation fallback to support_queue)
 same => n,Queue(support_queue,t,,,300)
 same => n,GotoIf($["${QUEUESTATUS}"=""]?hangup,1)
 same => n,Voicemail(9000@default,u)
 same => n,Goto(hangup,1)
exten => hangup,1,Hangup()
