; =========================================
; ALGO PBX — VOICEMAIL (Phase E)
; =========================================
[general]
format=wav ; matches MixMonitor's recording format (extensions.conf) for consistency
maxmsg=100
maxsecs=180
minsecs=3
; Voicemail-to-email — wiring only, no SMTP relay actually provisioned by
; this repo (out of scope, see LLM.md). serveremail is the From: address;
; without a working mailserver/smtp relay configured on the Asterisk host,
; delivery will simply fail silently from Asterisk's perspective (the
; message is still saved to the mailbox either way).
serveremail=voicemail@algopbx.local
attach=yes
; deleted after emailing? no — the mailbox copy is the source of truth for
; src/app/api/voicemail's listing/streaming/deletion, not the email.
deletevoicemail=no

[default]
; Static — not generated, not tied to any Extension/agent (Loop D1). The
; shared fallback mailbox extensions.conf's [from-dinstar] context routes
; a caller to when support_queue has no logged-in agents (joinempty=no,
; see queues.conf) or is full (maxlen, same file) — an inbound caller
; getting silence or a hard hangup in either case was the previous
; behavior, which this closes. Numeric ("9000", not e.g. "office") so it
; stays compatible with GET /api/voicemail's existing SAFE_MAILBOX
; (\d{3,6}) validation — any staff account can already read it there,
; same as any other mailbox they're authorized for.
9000 => 0000,Office Overflow,voicemail@algopbx.local

; Per-agent mailbox lines are generated from the Extension table — see
; src/lib/voicemail-config.ts and voicemail_dynamic.conf's own banner.
; Kept in a separate #include (not pasted directly into this static file)
; for the same reason pjsip.conf splits into pjsip-base/pjsip_dynamic: this
; file stays hand-editable for general settings without provisioning code
; ever risking clobbering them.
#include voicemail_dynamic.conf
