; =========================================
; ALGO PBX — HTTP / WEBSOCKET SERVER (Tier-0 fix)
; =========================================
; res_http_websocket serves WSS from Asterisk's built-in HTTP server, which
; is configured HERE, not by pjsip-base.conf's [transport-wss] bind= line.
; That PJSIP transport stanza only tells PJSIP which transport object to
; attach endpoints to; without this file nothing actually listens on 8089
; and every WebRTC agent's wss:// connection fails to establish before SIP
; is even in the picture. This was the #1 "no audio at all" defect found in
; the pre-trial audit.
;
; tlscertfile/tlsprivatekey MUST be a real CA-issued certificate for
; VM_PUBLIC_DOMAIN (e.g. Let's Encrypt) — browsers will not connect a wss://
; WebSocket to a self-signed cert without the user manually trusting it
; first, which agents cannot be expected to do. This is DIFFERENT from the
; DTLS-SRTP media certs in pbx_configs/keys/ (see that directory's README),
; which may be self-signed because dtls_verify=fingerprint on the PJSIP
; endpoint validates the SDP fingerprint, not the certificate chain.
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/fullchain.pem
tlsprivatekey=/etc/asterisk/keys/privkey.pem
; Plain HTTP (8088) is left enabled bound to 0.0.0.0 only because Asterisk
; requires *some* HTTP listener to be enabled for res_http_websocket to
; initialize at all; it is not exposed publicly (no docker-compose port
; publish, no security-group rule) and AMI/ARI HTTP endpoints are not used
; by this project (AMI is TCP on 5038 — see manager.conf). If that changes,
; revisit prefix/enablestatic below.
prefix=
enable_static=no
