; unixODBC driver registration referenced by odbc.ini's Driver=PostgreSQL.
; ⚠️ UNVERIFIED path — the psqlodbc shared library's install location is
; distro-specific. This is the common Alpine/apk path (`psqlodbc` package);
; if the tiredofit/asterisk image is based on something else, or doesn't
; ship the driver at all, this will need adjusting or the AGI fallback
; noted in odbc.ini applies instead.

[PostgreSQL]
Description = PostgreSQL ODBC driver
Driver      = /usr/lib/psqlodbc.so
Setup       = /usr/lib/psqlodbcw.so
FileUsage   = 1
