; unixODBC driver registration referenced by odbc.ini's Driver=PostgreSQL.
; VERIFIED (2026-08-27) against the real containerized Asterisk (Loop A1,
; Dockerfile.asterisk, Ubuntu 24.04 + the `odbc-postgresql` apt package)
; — this genuinely answers the "unverified whether this image has ODBC
; support" question carried since Phase C: it does, ODBC loads and this
; is the real driver path (`find / -iname 'psqlodbc*'` inside the running
; container), not a guess. The OLD Alpine-style path this replaced
; (/usr/lib/psqlodbc.so) was written against the tiredofit/asterisk image
; that turned out to never exist at all (see handoff.md) — never actually
; verified against anything real.

[PostgreSQL]
Description = PostgreSQL ODBC driver (Unicode)
Driver      = /usr/lib/x86_64-linux-gnu/odbc/psqlodbcw.so
Setup       = /usr/lib/x86_64-linux-gnu/odbc/psqlodbcw.so
FileUsage   = 1
