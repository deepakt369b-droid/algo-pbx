; =========================================
; ALGO PBX — MUSIC ON HOLD
; =========================================
; sip.js's hold() (src/contexts/sip-context.tsx) already re-INVITEs with
; a=sendonly on the agent's own leg — no softphone change needed for an
; agent putting a caller on hold from the WebRTC UI. This config is what
; actually plays audio to the *other* party during that hold, and is also
; what queues.conf's musicclass=default plays to callers waiting in
; support_queue.

[default]
mode=files
; Real bug found live-verifying Loop D1 on the VM: a relative `directory=`
; value (documented upstream as resolved against astdatadir/moh) silently
; registered ZERO MOH classes in this from-source Asterisk 20 build — no
; parse error, no warning, `moh show classes` just came back empty, across
; multiple module reload/unload/reload and full `core reload` cycles. Only
; an absolute path actually works here. Files still live on the host at
; ./moh/default (see docker-compose.yml and moh/default/README.md for what
; belongs there — this repo ships none; audio licensing is an operator
; concern), mounted read-only to the path below.
directory=/var/lib/asterisk/moh/default
