; =========================================
; ALGO PBX — MUSIC ON HOLD
; =========================================
; sip.js's hold() (src/contexts/sip-context.tsx) already re-INVITEs with
; a=sendonly on the agent's own leg — no softphone change needed for an
; agent putting a caller on hold from the WebRTC UI. This config is what
; actually plays audio to the *other* party during that hold, and is also
; what queues.conf's musicclass=default plays to callers waiting in
; support_queue.

[default]
mode=files
; Files under this directory (relative to Asterisk's astmoddir MOH root,
; /var/lib/asterisk/moh) are played in order/shuffled per Asterisk defaults.
; Mounted from ./moh/default on the host — see docker-compose.yml and
; moh/default/README.md for what belongs there (this repo ships none: audio
; licensing is an operator concern, not something to bundle here).
directory=default
