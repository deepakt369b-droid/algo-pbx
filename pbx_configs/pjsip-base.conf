; =========================================
; GLOBAL SETTINGS
; =========================================

; Pins moh_passthrough explicitly rather than relying on PJSIP's own
; default (which is already "no", but was never stated anywhere in this
; repo). moh_passthrough=yes would make Asterisk forward whatever MOH the
; FAR END sends instead of generating this box's own musiconhold.conf
; audio — silently defeating "the caller/agent hears music while held" if
; anyone ever flips it. See musiconhold.conf's own header for the sibling
; MOH gaps this was written alongside.
[global]
type=global
moh_passthrough=no

; =========================================
; TRANSPORT CONFIGURATIONS
; =========================================

; 1. UDP Transport for Dinstar Gateway & IP Phones
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; 2. Secure WebSocket Transport for WebRTC Agents
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; =========================================
; DINSTAR 4-PORT GSM GATEWAY TRUNK (UAE)
; Reached only via the Tailscale subnet route — see
; ALGO_PBX_MASTER_DOC.md §6.3 for the routing setup.
; =========================================
[dinstar-trunk]
type=endpoint
transport=transport-udp
context=from-dinstar
disallow=all
; g729 dropped: it is a licensed codec not present in mainline Asterisk 20
; builds. If the Dinstar ever negotiates it and this image lacks the
; transcoder, the call fails to bridge with no obvious error. alaw/ulaw are
; what a GSM gateway actually needs — the underlying call is 8kHz either
; way, so nothing is lost by removing it. Re-add only after confirming the
; licensed g729 transcoder is installed in the deployed Asterisk image.
allow=alaw,ulaw
aors=dinstar-aor
direct_media=no
; The gateway is reached through a Tailscale subnet route whose router
; SNATs tailnet->LAN traffic to its own LAN IP (192.168.11.10). The
; gateway therefore receives Asterisk's RTP from 192.168.11.10:<mapped
; port>, not from the 100.64.x.x address in Asterisk's SDP, and its
; replies only come back if it answers to that same mapped source. These
; two make Asterisk (a) accept RTP from whatever address/port the media
; actually arrives from rather than the SDP-advertised one, and (b) send
; its own RTP back to that learned address — i.e. symmetric/latching RTP,
; the same setting webrtc endpoints already carry. Without them the leg
; connects (200 OK) but no audio flows in either direction and
; rtp_timeout tears the call down at 30s. The gateway must ALSO be in a
; symmetric-RTP / NAT media mode for the return direction.
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; Was previously unset, which happens to fall back to PJSIP's own implicit
; default of "default" — the same name as musiconhold.conf's only class,
; so this endpoint's hold audio worked, but only by coincidence: nothing
; in this repo actually said so. Pinned explicitly so a future second MOH
; class (e.g. a different queue's hold music) can't silently break this
; trunk's hold audio by changing what the implicit default resolves to.
moh_suggest=default
; DTMF mode was unset here, which meant PJSIP's default (rfc4733) was in
; effect. If the Dinstar gateway is configured for SIP INFO or inband DTMF
; instead, agent keypresses silently fail to reach IVRs on the far end —
; the browser leg is unaffected (webrtc=yes implies telephone-event), so
; this manifests only on outbound calls, which makes it easy to miss in
; testing. Set this to match whatever mode the Dinstar UC2000 is actually
; configured for (check its SIP settings page); rfc4733 is the safer
; default if unsure, since it's what most modern gateways use.
dtmf_mode=rfc4733
; Reclaim ports from a GSM leg that dies without a clean BYE (matches the
; rtp_timeout defaults in rtp.conf, restated explicitly since PJSIP
; endpoint-level timeouts can be set to override rtp.conf's [general]
; defaults per-endpoint if this trunk ever needs different values).
rtp_timeout=30
rtp_timeout_hold=300

; [dinstar-aor] and [dinstar-identify] used to be hand-written here with a
; hardcoded 192.168.1.50 — in a read-only mount, so changing the Dinstar's
; IP required SSH access to this file. They are now generated into
; pjsip_dinstar.conf by src/lib/dinstar-config.ts (driven by the
; /admin/dinstar setup wizard or the DINSTAR_LAN_IP setting) and
; #included below, the same read-write-generated-file pattern
; pjsip_dynamic.conf already uses for extensions.

; Extension endpoints (WebRTC agents, hardware phones) used to be
; hand-written here as [1001]/[2001] templates. As of Phase A they're
; generated into pjsip_dynamic.conf instead (see src/lib/pjsip-config.ts and
; pjsip.conf's #include below) — this file now holds only the static
; transport/trunk config that provisioning never touches.
