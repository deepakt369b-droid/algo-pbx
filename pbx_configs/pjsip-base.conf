; =========================================
; TRANSPORT CONFIGURATIONS
; =========================================

; 1. UDP Transport for Dinstar Gateway & IP Phones
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; 2. Secure WebSocket Transport for WebRTC Agents
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; =========================================
; DINSTAR 4-PORT GSM GATEWAY TRUNK (UAE)
; Reached only via the Tailscale subnet route — see
; ALGO_PBX_MASTER_DOC.md §6.3 for the routing setup.
; =========================================
[dinstar-trunk]
type=endpoint
transport=transport-udp
context=from-dinstar
disallow=all
; g729 dropped: it is a licensed codec not present in mainline Asterisk 20
; builds. If the Dinstar ever negotiates it and this image lacks the
; transcoder, the call fails to bridge with no obvious error. alaw/ulaw are
; what a GSM gateway actually needs — the underlying call is 8kHz either
; way, so nothing is lost by removing it. Re-add only after confirming the
; licensed g729 transcoder is installed in the deployed Asterisk image.
allow=alaw,ulaw
aors=dinstar-aor
direct_media=no
; DTMF mode was unset here, which meant PJSIP's default (rfc4733) was in
; effect. If the Dinstar gateway is configured for SIP INFO or inband DTMF
; instead, agent keypresses silently fail to reach IVRs on the far end —
; the browser leg is unaffected (webrtc=yes implies telephone-event), so
; this manifests only on outbound calls, which makes it easy to miss in
; testing. Set this to match whatever mode the Dinstar UC2000 is actually
; configured for (check its SIP settings page); rfc4733 is the safer
; default if unsure, since it's what most modern gateways use.
dtmf_mode=rfc4733
; Reclaim ports from a GSM leg that dies without a clean BYE (matches the
; rtp_timeout defaults in rtp.conf, restated explicitly since PJSIP
; endpoint-level timeouts can be set to override rtp.conf's [general]
; defaults per-endpoint if this trunk ever needs different values).
rtp_timeout=30
rtp_timeout_hold=300

[dinstar-aor]
type=aor
contact=sip:192.168.1.50:5060 ; Tailscale local IP of Dinstar — keep in sync with DINSTAR_LAN_IP in .env

[dinstar-identify]
type=identify
endpoint=dinstar-trunk
match=192.168.1.50

; Extension endpoints (WebRTC agents, hardware phones) used to be
; hand-written here as [1001]/[2001] templates. As of Phase A they're
; generated into pjsip_dynamic.conf instead (see src/lib/pjsip-config.ts and
; pjsip.conf's #include below) — this file now holds only the static
; transport/trunk config that provisioning never touches.
