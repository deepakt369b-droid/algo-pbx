; =========================================
; ALGO PBX — QUEUE CONFIGURATION
; =========================================
; This file was missing entirely until now, which was a hard runtime bug:
; extensions.conf's [from-dinstar] context routes every inbound call to
; Queue(support_queue,...), but with no queues.conf the queue is undefined
; and the Queue() application fails — i.e. no inbound call could ever be
; serviced. Nothing downstream (wallboard, queue stats, agent routing) can
; work without this.

[general]
; Keep dynamically-added members (AMI QueueAdd / AddQueueMember) across an
; Asterisk restart. Matters because Phase A provisioning adds agents at
; runtime rather than editing this file.
persistentmembers = yes
autofill = yes
; MixMonitor (not the deprecated Monitor) — matches the MixMonitor() call
; added to extensions.conf for call recording.
monitor-type = MixMonitor

; =========================================
; SUPPORT QUEUE
; Name MUST stay in sync with extensions.conf's Queue(support_queue,...)
; and with the Queue.name row in prisma/schema.prisma.
; =========================================
[support_queue]
; NOTE: Prisma's Queue.strategy column also stores a strategy and nothing
; syncs the two — Asterisk reads it from here, the web UI reads it from
; Postgres, and they can silently disagree (extension provisioning had this
; same class of gap until Phase A's config-generation fixed it for
; pjsip.conf; queues.conf isn't generated yet). Tracked in LLM.md; do not
; assume changing the DB value affects call routing.
strategy = ringall

; Ring each agent for 15s before moving on; wait 5s between ring cycles.
timeout = 15
retry = 5
; Give an agent 10s after a call to finish notes before offering the next.
wrapuptime = 10
; Unlimited callers may wait (0 = no cap).
maxlen = 0
; Hold music class — defined in musiconhold.conf (Phase B).
musicclass = default
; Don't offer a call to an agent who is already on one.
ringinuse = no

; joinempty/leaveempty: DEVELOPMENT-FRIENDLY SETTING — REVISIT FOR PRODUCTION.
; joinempty=yes lets callers enter even when no agent is logged in, so that
; inbound calls don't hard-fail while the system is being brought up and no
; extensions are registered yet. A real call center usually wants
; joinempty=no (send to voicemail/announcement instead of parking a caller
; in an unstaffed queue with no prospect of an answer).
joinempty = yes
leaveempty = no

; Periodic "thanks for holding" style announcements. announce-frequency=0
; disables the position announcement until real prompt audio is in place.
announce-frequency = 0
periodic-announce-frequency = 60

; No static `member =>` line here anymore — membership is fully dynamic
; now (src/lib/queue-membership.ts): an agent is added via AMI QueueAdd
; when their extension is provisioned (POST /api/admin/users), removed on
; disable, and reconciled with reconcileQueueMembership() so a fresh
; Asterisk boot picks up whatever agents already exist in Postgres. A
; queue with zero members is expected and correct on a brand-new install
; before the first agent is created — joinempty=yes above is what keeps
; that from hard-failing inbound calls in the meantime.
