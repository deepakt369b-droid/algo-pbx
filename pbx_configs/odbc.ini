; =========================================
; unixODBC system DSN — Do Not Call lookup (Phase C)
; =========================================
; ⚠️ UNVERIFIED against the actual tiredofit/asterisk:20-latest image. This
; assumes unixODBC + a PostgreSQL ODBC driver (commonly packaged as
; `psqlodbc` / driver name "PostgreSQL" or "PostgreSQL Unicode") are
; installed in that image. If they are not, `res_odbc reload` will fail to
; connect and pbx_configs/func_odbc.conf's DNC_CHECK lookup will simply
; return empty (fail-open, not fail-closed — see extensions.conf's comment
; on that tradeoff) rather than crash the dialplan.
;
; Fallback if this image lacks ODBC support at all: replace the func_odbc
; approach with an AGI script that calls back into GET /api/dnc/check over
; HTTP instead of hitting Postgres directly. Not built — this file and
; func_odbc.conf are the primary approach per the approved plan; note the
; fallback exists so a future session doesn't have to re-derive it.
;
; ini-style config has no env-var interpolation — these values must be kept
; in sync with .env's POSTGRES_* by hand, same class of manual-sync
; requirement as the other REPLACE_ME_* placeholders in this directory.

[algopbx_pg]
Description = Algo PBX Postgres (DNC lookup only)
Driver      = PostgreSQL
; NOT "postgres" (the compose service's DNS name) — that name only resolves
; on the `algo-net` bridge network's embedded DNS. The `asterisk` service
; runs with network_mode: host (required for RTP — see LLM.md §2), so it
; shares the host's network namespace directly and has no bridge-network
; DNS at all. It reaches Postgres the same way manager.conf's AMI_HOST
; comment describes reaching things in the other direction: via the host's
; own interface, where the `postgres` service's `ports: ["5432:5432"]`
; mapping already publishes it.
Servername  = 127.0.0.1
; Default port matches docker-compose.yml's postgres:5432 publish. If you use
; a local docker-compose.override.yml to remap the host-published port (e.g.
; to 15432 to avoid a native Postgres install), update Port here to match the
; host-published port while the override is active. Production deploys with
; the committed docker-compose.yml should leave this as 5432.
Port        = 5432
Database    = REPLACE_ME_POSTGRES_DB
UserName    = REPLACE_ME_POSTGRES_USER
Password    = REPLACE_ME_POSTGRES_PASSWORD
