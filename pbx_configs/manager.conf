[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
; Asterisk runs with network_mode: host (binds directly to the VM's
; interfaces), but the Next.js `web` container is on the bridged `algo-net`
; network — it reaches AMI via the Docker bridge gateway, not 127.0.0.1.
; The permit ACL below restricts that to the Docker bridge subnet only;
; 5038 must NOT be exposed on the VM's public interface (no host firewall
; rule / cloud security-group entry for it).

[algopbx-app]
secret = REPLACE_ME_AMI_SECRET
deny = 0.0.0.0/0.0.0.0
permit = 172.16.0.0/255.240.0.0
; ^ covers Docker's default bridge allocation range (172.17-31.x.x). If your
; `algo-net` bridge is assigned outside this range, check with
; `docker network inspect algo-pbx_algo-net` and narrow/adjust accordingly.
read = system,call,agent,user,queue,cdr
; `command` is required for Action: Command (used by src/lib/pjsip-provision.ts,
; voicemail-provision.ts, dinstar-provision.ts to issue `pjsip reload` etc.).
; Without it Asterisk answers every reload with Response: Error, which
; AmiClient.send() historically swallowed as success — see that file's comment.
write = system,call,agent,user,queue,originate,command

; Separate, narrowly-scoped account for scripts/ami-cdr-listener.ts. It
; previously shared [algopbx-app]'s full `read = ...,call,...` class,
; meaning it received the ENTIRE high-volume call-event firehose
; (Newchannel/Newstate/VarSet/DTMFBegin/DTMFEnd/RTCPSent/RTCPReceived for
; every channel) despite only ever using the Cdr event — everything else
; was received, parsed, and discarded per-event
; (ami-cdr-listener.ts's own event handler). That's needless work sharing
; a host with the media engine, and a slow consumer risked Asterisk's
; manager session buffering under load. This account can only ever read
; `cdr`, so the listener process is structurally incapable of receiving
; (or, since it has no write class at all, sending) anything else.
[algopbx-cdr-listener]
secret = REPLACE_ME_CDR_LISTENER_AMI_SECRET
deny = 0.0.0.0/0.0.0.0
permit = 172.16.0.0/255.240.0.0
read = cdr
write =
eventfilter = Event: Cdr
