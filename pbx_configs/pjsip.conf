; This file is now just the join point between static and generated PJSIP
; config (Phase A). Asterisk's #include is relative to /etc/asterisk/ — both
; files below are mounted there by docker-compose.yml alongside this one.
;   - pjsip-base.conf:    static, hand-edited, read-only mount. Transports
;                          and the Dinstar trunk live here.
;   - pjsip_dynamic.conf: generated by src/lib/pjsip-config.ts from the
;                          Extension table in Postgres, read-write mount
;                          (the `web` container writes it; `asterisk` reads
;                          it and gets told to `pjsip reload` over AMI after
;                          each write). Never hand-edit this one — see its
;                          own banner comment.
#include pjsip-base.conf
#include pjsip_dynamic.conf
