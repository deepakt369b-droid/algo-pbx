; This file is now just the join point between static and generated PJSIP
; config (Phase A). Asterisk's #include is relative to /etc/asterisk/ — all
; three files below are mounted there by docker-compose.yml alongside this
; one.
;   - pjsip-base.conf:    static, hand-edited, read-only mount. Transports
;                          and the Dinstar trunk's fixed settings live here.
;   - pjsip_dynamic.conf: generated by src/lib/pjsip-config.ts from the
;                          Extension table in Postgres, read-write mount
;                          (the `web` container writes it; `asterisk` reads
;                          it and gets told to `pjsip reload` over AMI after
;                          each write). Never hand-edit this one — see its
;                          own banner comment.
;   - pjsip_dinstar.conf: generated by src/lib/dinstar-config.ts from the
;                          DINSTAR_LAN_IP setting (or the /admin/dinstar
;                          wizard) — the Dinstar gateway's discovered
;                          contact IP. Same read-write pattern as
;                          pjsip_dynamic.conf. Never hand-edit.
#include pjsip-base.conf
#include pjsip_dynamic.conf
#include pjsip_dinstar.conf
