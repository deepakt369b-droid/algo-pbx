; =========================================
; ALGO PBX — MODULE LOADING
; =========================================
; Real bug found deploying Loop A1 (containerized Asterisk): this file
; never existed anywhere in pbx_configs/ because every prior deploy ran
; against a NATIVE Asterisk installed via `make samples`, which silently
; generates its own default modules.conf as a side effect. Dockerfile.
; asterisk deliberately skips `make samples` (this repo's real
; pbx_configs/ is bind-mounted over /etc/asterisk instead — sample
; configs would be dead weight) — which meant NOTHING provided a
; modules.conf at all. Asterisk's loader treats that as fatal, not a
; fall-back-to-defaults case like most other missing .conf files: with no
; modules.conf, `asterisk.c`'s `check_init()` aborts immediately with
; "Module initialization failed. ASTERISK EXITING!" before loading
; anything else — which is why the container crash-looped with no other
; diagnostic in its logs (the failure happens before logger.conf's own
; file-target config is even read).
;
; autoload=yes is the standard, simplest correct config: load every
; module actually present on disk. This is safe here specifically
; because module SELECTION already happened at the BUILD level
; (pbx_configs/asterisk-menuselect.makeopts) — modules this stack doesn't
; want were never compiled in the first place, so there's nothing to
; explicitly noload= here.
[modules]
autoload=yes
