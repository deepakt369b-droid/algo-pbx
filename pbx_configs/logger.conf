; =========================================
; ALGO PBX — LOGGING (Loop D2)
; =========================================
; Did not exist before — Asterisk had no logger.conf at all, meaning
; whatever this image's own defaults were determined its logging behavior
; silently and unreviewed.
;
; Deliberately does NOT define a `full`/verbose file-log target under
; [logfiles], even though that's the more common tutorial pattern —
; adding one here, without also standing up logrotate inside this
; container (which doesn't exist yet; this Asterisk image is itself still
; the "not really containerized" gap flagged in this session's plan,
; Phase A) would just recreate the exact unbounded-disk-growth problem
; this loop exists to close, one file later. Asterisk's console-channel
; output (notice/warning/error/verbose — on by default when run in
; foreground, which this container does) already reaches Docker's own
; stdout capture, which docker-compose.yml's shared `x-logging` anchor
; caps at 10MB × 3 files — that IS this service's durable, already-
; rotated log. Use `docker logs algo-asterisk` or `asterisk -rvvv` for a
; live console instead of grepping a file. Revisit this file once
; Asterisk is for-real containerized (Loop A1) and a logrotate story
; exists to pair with a file target.

[general]
dateformat=%F %T

[logfiles]
; Security-relevant events ONLY (failed AMI logins, SIP registration/auth
; failures) — much lower volume than verbose/notice, worth a dedicated
; on-disk trail for incident review even without logrotate wired up yet;
; revisit the growth-rate assumption if this ever proves wrong in
; practice.
security => security
