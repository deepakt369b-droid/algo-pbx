; =========================================
; DNC_CHECK() dialplan function (Phase C)
; =========================================
; Defines ${DNC_CHECK(<number-as-dialed>)} for use in extensions.conf's
; [from-agent-common] shared outbound handler (reached via Goto from
; whichever from-agent-local/-national/-international dial-permission
; tier matched — see that file's Loop C2 header comment) — the MANDATORY
; half of the two-layer DNC enforcement described in
; prisma/schema.prisma's DoNotCallEntry model comment. Returns "1" if the
; number is on the blocklist, empty otherwise.
;
; ⚠️ Confidence: MEDIUM on exact func_odbc.conf syntax (readsql/dsn key
; names) — not verified against a live Asterisk 20 instance or its
; func_odbc.conf.sample. Verify before relying on this in production.
;
; ⚠️ Known limitation, not a bug to "fix" here: this does a raw string
; match against ${ARG1} (the digits Asterisk sees, i.e. whatever the agent
; actually dialed) plus a same-with-leading-"+" fallback. It does NOT run
; the same normalization as src/lib/phone-normalize.ts (the dialplan can't
; call a TypeScript function) — a DNC entry stored as "+971501234567" will
; NOT match if an agent dials "0501234567" without a leading zero-stripped
; country code. Real coverage requires operators to standardize how numbers
; are dialed (e.g. always include the country code), or a future AGI-based
; check that proxies through the app's own normalizeToE164 over HTTP. Flag
; this to whoever owns compliance sign-off — it is a real gap, not
; theoretical.
[DNC_CHECK]
dsn=algopbx-dnc
readsql=SELECT 1 FROM "DoNotCallEntry" WHERE "numberE164" IN ('${SQL_ESC(${ARG1})}','${SQL_ESC(+${ARG1})}') LIMIT 1

; =========================================
; RECORDING_ENABLED() / RECORDING_ANNOUNCE_ENABLED() (S6)
; =========================================
; Global, admin-controlled kill switches for call recording and the
; "this call may be recorded" declaration. Same mechanism as DNC_CHECK
; above: a dialplan ODBC read against Postgres, reusing the proven
; dsn=algopbx-dnc registration (res_odbc.conf) — a plain SELECT, never a
; write. The point of doing this in the dialplan rather than regenerating
; a .conf file is that the toggle takes effect on the NEXT call with NO
; `module reload` / `dialplan reload` — module reload is a documented,
; re-confirmed unreliability on this VPS (see MEMORY.md).
;
; Backing store: the "PbxRuntimeFlag" table (migration
; 20260901120000_add_pbx_runtime_flags) — a deliberately SEPARATE table
; from "AppSetting" because AppSetting rows are AES-GCM encrypted
; (src/lib/settings/crypto.ts) and the dialplan cannot decrypt them.
; PbxRuntimeFlag stores a plain boolean the SQL layer can read directly.
; Written only by POST /api/admin/recording (requireAdminSession + AuditLog).
;
; ⚠️ FAIL OPEN — BY DESIGN. Both functions return '1' when the flag is on,
; '0' ONLY when a row explicitly says so, and EMPTY on any other outcome:
; ODBC driver missing, Postgres unreachable, table absent (migration not
; yet deployed), row missing, permission error. Every caller below treats
; "not exactly '0'" as "proceed" — i.e. a broken lookup RECORDS THE CALL
; and PLAYS THE ANNOUNCEMENT. We never silently stop recording, and we
; never record silently. Turning recording OFF requires a healthy DB
; round-trip that returns a real '0'.
;
; ⚠️ Confidence: MEDIUM on exact func_odbc.conf syntax, same caveat as
; DNC_CHECK — verify `odbc show` + a test call before trusting in prod.
[RECORDING_ENABLED]
dsn=algopbx-dnc
readsql=SELECT CASE WHEN "enabled" THEN '1' ELSE '0' END FROM "PbxRuntimeFlag" WHERE "key" = 'recording_enabled' LIMIT 1

[RECORDING_ANNOUNCE_ENABLED]
dsn=algopbx-dnc
readsql=SELECT CASE WHEN "enabled" THEN '1' ELSE '0' END FROM "PbxRuntimeFlag" WHERE "key" = 'recording_announcement_enabled' LIMIT 1

; =========================================
; AI_INBOUND_EXTENSION() / AI_EXTENSION_CHECK() (Hybrid AI + Human plan,
; LLM.md decision 2026-09-14)
; =========================================
; Used by extensions.conf's [from-dinstar] (inbound) and
; [from-agent-local]'s _1XXX/_2XXX internal-dial handlers (internal
; transfer/direct-dial) to decide whether a call should go to the
; ai-voice-agent sidecar (AudioSocket, see [from-dinstar-ai]/
; [ai-agent-internal]) instead of the human queue / a PJSIP Dial(). Same
; dsn=algopbx-dnc registration as DNC_CHECK/RECORDING_ENABLED above — a
; plain SELECT, never a write.
;
; ⚠️ FAIL CLOSED TO EXISTING BEHAVIOR — the opposite polarity from
; RECORDING_ENABLED's fail-open, and deliberately so: an empty/errored
; result here must never accidentally route a real caller into an AI agent
; that isn't confirmed enabled. AI_INBOUND_EXTENSION returns a non-empty
; extension NUMBER only when a healthy DB read finds one; any lookup
; failure (ODBC driver missing, Postgres unreachable, no enabled AI agent)
; returns empty, which the GotoIf() callers treat as "fall through to the
; existing human-queue/PJSIP-Dial path, unchanged". AI_EXTENSION_CHECK
; mirrors this: '1' only on a confirmed match, empty/'0' otherwise (also
; treated as "not AI" by its caller).
;
; ⚠️ Follow-up to §34 (LLM.md, 2026-09-14): AI_INBOUND_EXTENSION now takes
; ARG1, the Dinstar GSM port number (1-4, matching WaInstance.simPort's
; numbering and AiAgent.dinstarPort's schema column), and resolves the ONE
; enabled AI-kind Extension assigned to THAT port for the calling tenant —
; this is what makes more than one AI agent live at once possible (one per
; port), replacing the old "resolves a single enabled AI-kind Extension
; globally" behavior. If ${ARG1} is empty (port unknown to the dialplan —
; see extensions.conf's [from-dinstar] DINSTAR_PORT comment), the
; "AiAgent"."dinstarPort" = ${SQL_ESC(${ARG1})} comparison matches nothing
; (empty string against an integer column), so this correctly fails closed
; to the existing human-queue path — same fail-to-existing-behavior
; convention as before, not a new failure mode.
;
; ⚠️ ASSUMPTION, flagged not hidden — genuinely unverified, not just
; "medium confidence": this only works once ${ARG1} (DINSTAR_PORT) actually
; carries a real per-call port number. Today the Dinstar gateway routes all
; 4 GSM ports through one shared Port Group -> one shared trunk with no
; live-confirmed per-port signal visible to Asterisk (LLM.md §25.1's
; "Port Group-0 -> Trunk-0" finding) — extensions.conf's [from-dinstar]
; cannot yet populate DINSTAR_PORT with a trustworthy value. See that
; context's own comment for what would make this real: either
; reconfiguring the gateway's PortCfg/SipAccN so each port registers as its
; own distinct SIP identity, or a live trace of what the gateway actually
; sends per port today. Neither has been done.
;
; ⚠️ Confidence: MEDIUM on exact func_odbc.conf readsql/dsn syntax, same
; caveat this file already carries for DNC_CHECK/RECORDING_ENABLED above —
; verify `odbc show` + a test call before trusting in production.
[AI_INBOUND_EXTENSION]
dsn=algopbx-dnc
readsql=SELECT "Extension"."number" FROM "Extension" JOIN "AiAgent" ON "AiAgent"."extensionId" = "Extension"."id" WHERE "Extension"."agentType" = 'AI' AND "AiAgent"."enabled" = true AND "AiAgent"."dinstarPort" = ${SQL_ESC(${ARG1})} LIMIT 1

; Follow-up to §34 (LLM.md, 2026-09-14): deliberately NOT made port-aware.
; [ai-agent-internal]'s call path (an already-authenticated PJSIP agent
; dialing an AI extension's own number, e.g. _1XXX/_2XXX) never touches the
; Dinstar gateway at all — there is no GSM port in play for an internal
; dial, so ARG1 stays exactly what it already was (the dialed extension
; number). AiAgent.dinstarPort only matters for [from-dinstar]'s inbound
; routing (AI_INBOUND_EXTENSION above); an internal dial reaches an AI
; agent by extension number regardless of which port (if any) it's also
; assigned to for inbound GSM calls.
[AI_EXTENSION_CHECK]
dsn=algopbx-dnc
readsql=SELECT CASE WHEN COUNT(*) > 0 THEN '1' ELSE '0' END FROM "Extension" JOIN "AiAgent" ON "AiAgent"."extensionId" = "Extension"."id" WHERE "Extension"."number" = '${SQL_ESC(${ARG1})}' AND "Extension"."agentType" = 'AI' AND "AiAgent"."enabled" = true

; =========================================
; CALLER_ROUTING_ACTION() dialplan function
; =========================================
; Independently designed (2026-09-14, Tel-Agent gap analysis — no
; third-party code or SQL reused; see prisma/schema.prisma's
; CallerRoutingRule header). Defines ${CALLER_ROUTING_ACTION(<caller
; number>)} for use in extensions.conf's [from-dinstar] `s` extension,
; consulted BEFORE AI_INBOUND_EXTENSION() so a tenant can force a known
; number straight to the human queue (PASS) or refuse it outright (BLOCK),
; independent of which Dinstar port the call arrived on. Returns 'PASS',
; 'BLOCK', 'AI', or empty when no rule matches — empty is the fail-CLOSED-
; to-today's-existing-behavior value: an unmatched caller proceeds through
; the dialplan exactly as it did before this function existed, same
; polarity DNC_CHECK/AI_INBOUND_EXTENSION above already use.
;
; Longest-prefix-wins, mirroring src/lib/caller-routing.ts's
; matchCallerRule() (that TS function is for the admin UI's own preview and
; unit tests — this SQL is the actual decision made at call time; the two
; are written to agree, not to share code). An exact-number rule is simply
; the longest possible match against itself, so no separate "prefer exact"
; branch is needed: ORDER BY LENGTH("pattern") DESC already puts it first.
;
; NOT tenant-scoped, same as DNC_CHECK above and for the identical reason:
; extensions.conf's [from-dinstar] has no real per-call tenant identifier
; to pass in yet (AI_TENANT_ID is hardcoded empty — see that context's own
; "Follow-up to §34" comment). Revisit together with that gap, not
; separately, once real per-DID tenant routing exists.
;
; ⚠️ Confidence: MEDIUM on exact func_odbc.conf readsql/dsn syntax, same
; standing caveat this file already carries for every function above —
; verify `odbc show` + a live test call per pattern (PASS/BLOCK/AI/no
; match) before trusting in production.
[CALLER_ROUTING_ACTION]
dsn=algopbx-dnc
readsql=SELECT "action"::text FROM "CallerRoutingRule" WHERE '${SQL_ESC(${ARG1})}' LIKE REPLACE("pattern", '*', '%') ORDER BY LENGTH("pattern") DESC LIMIT 1
