; =========================================
; ALGO PBX — CORE ASTERISK OPTIONS
; =========================================
; Did not exist before. Without it, Asterisk runs at normal OS scheduling
; priority and competes for CPU with the other four containers on the same
; host (Postgres, Next.js, the CDR listener) — a Prisma migration or a
; heavy CDR query can starve Asterisk's media threads mid-call, producing
; audio dropouts correlated with unrelated web activity, which is one of
; the hardest classes of voice bug to diagnose after the fact.
[options]
; Requests a mildly elevated scheduling priority from the OS for
; Asterisk's own threads. Requires the container to hold CAP_SYS_NICE (see
; docker-compose.yml's asterisk.cap_add) or this silently has no effect.
highpriority=yes
