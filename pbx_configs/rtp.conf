[general]
; Widened from the original 101-port range (10000-10100), which capped the
; system at ~50 RTP streams (~25 concurrent calls, since an answered call
; uses two legs) and — worse — collided with Coturn's identical range on
; the same host network (see docker-compose.yml's coturn command, now
; 20001-30000). Disjoint, and sized for real headroom.
rtpstart=10000
rtpend=20000

; Reclaim ports from dead channels instead of leaking them until the pool
; is exhausted (a laptop lid closing mid-call, a GSM leg that dies without
; a clean BYE). Absence of this was a real production risk: with only 101
; ports, a handful of leaked channels per day silently degrades every new
; call to no-audio. Applies as a default; also set per-endpoint in
; pjsip-config.ts's templates and on the Dinstar trunk.
rtp_timeout=30
rtp_timeout_hold=300

strictrtp=yes
icesupport=yes

; Deliberately no stunaddr/turnaddr/turnuser/turnpwd here. Asterisk itself
; sits on a public IP and does not need STUN/TURN for its own RTP; TURN is
; a *browser-side* fallback for agents behind symmetric NAT, wired up via
; ICE servers in src/contexts/sip-context.tsx instead (see that file's
; header comment). The previous version of this file pointed Asterisk's
; own STUN lookups at an unsubstituted "YOUR_VM_PUBLIC_DOMAIN" placeholder,
; which added a DNS-failure stall to every single call's setup time, and
; its TURN credentials (a static username/password) were structurally
; incompatible with coturn's --use-auth-secret mode in docker-compose.yml
; (which only accepts ephemeral REST credentials) — so even after fixing
; the hostname it could never have authenticated.
