; =========================================
; ALGO PBX — AD-HOC 3-WAY CONFERENCE (Phase G)
; =========================================
; ConfBridge does the actual audio mixing — browser-side WebRTC alone can't
; mix three parties, only Asterisk can. Orchestrated server-side by
; POST /api/calls/conference (AMI Redirect + Originate), not by the
; softphone directly; see that route's file-header comment for the full
; flow and its confidence caveats.

[default_bridge]
type=bridge
; Internal mixing (not, e.g., SFU passthrough) — needed since legs may use
; different codecs (WebRTC opus vs. the Dinstar trunk's alaw/ulaw/g729).
mixing_interval=20
record_conference=no ; call recording is handled separately per-call by MixMonitor (Foundation phase), not duplicated here

[default_user]
type=user
; No music-on-hold while waiting for others to join — a 3-way ad-hoc
; conference is expected to have all parties present within seconds of
; being created, unlike a persistent meeting room.
music_on_hold_when_empty=no
announce_join_leave=no
; Legs joining a conference can include the GSM/Tailscale trunk leg
; (jitter-prone, see extensions.conf) mixed with a WebRTC leg (low-jitter
; but different clock) — without per-user de-jittering here, ConfBridge's
; mixer sees uneven inter-arrival timing from the GSM party and every
; participant hears it as choppy audio, not just the GSM party's own leg.
jitterbuffer=yes
