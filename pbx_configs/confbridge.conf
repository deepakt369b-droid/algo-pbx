; =========================================
; ALGO PBX — AD-HOC 3-WAY CONFERENCE (Phase G)
; =========================================
; ConfBridge does the actual audio mixing — browser-side WebRTC alone can't
; mix three parties, only Asterisk can. Orchestrated server-side by
; POST /api/calls/conference (AMI Redirect + Originate), not by the
; softphone directly; see that route's file-header comment for the full
; flow and its confidence caveats.

[default_bridge]
type=bridge
; Internal mixing (not, e.g., SFU passthrough) — needed since legs may use
; different codecs (WebRTC opus vs. the Dinstar trunk's alaw/ulaw/g729).
mixing_interval=20
record_conference=no ; call recording is handled separately per-call by MixMonitor (Foundation phase), not duplicated here

[default_user]
type=user
; No music-on-hold while waiting for others to join — a 3-way ad-hoc
; conference is expected to have all parties present within seconds of
; being created, unlike a persistent meeting room.
music_on_hold_when_empty=no
announce_join_leave=no
; Legs joining a conference can include the GSM/Tailscale trunk leg
; (jitter-prone, see extensions.conf) mixed with a WebRTC leg (low-jitter
; but different clock) — without per-user de-jittering here, ConfBridge's
; mixer sees uneven inter-arrival timing from the GSM party and every
; participant hears it as choppy audio, not just the GSM party's own leg.
jitterbuffer=yes

; =========================================
; AI -> HUMAN ESCALATION CONFERENCE (LLM.md §34.2, 2026-09-14)
; =========================================
; Separate bridge type + user profiles from default_bridge/default_user
; above — those stay untouched (manager-merge/conference API routes depend
; on them). This trio is used only by extensions.conf's [ai-conference]
; context, orchestrated by src/app/api/internal/ai/escalate/route.ts.

[ai_conf_bridge]
type=bridge
mixing_interval=20 ; matches AudioSocket's 20ms frame cadence (audiosocket/protocol.py's FRAME_MS) - do not lower, it would just double the mixer's wakeups against a source that can't send faster anyway
record_conference=no ; the caller's own MixMonitor (started once in extensions.conf's [from-dinstar] `s` extension) already covers this call - see [ai-conference]'s own header comment on why NOT duplicating it here matters
; Every leg in an AI escalation is 8kHz: Dinstar GSM (alaw/ulaw), a desk
; phone's PJSIP leg, and the AudioSocket leg (app_audiosocket's native
; 8kHz signed-linear framing). Pinning this avoids the bridge floating to
; 16/48kHz and silently resampling the AI's own leg in both directions for
; no benefit. Revisit if a WebRTC/opus softphone leg is ever escalated
; into this specific bridge type.
internal_sample_rate=8000

; The CALLER and the HUMAN AGENT — the two "real" parties. marked=yes is
; the whole mechanism the AI leg's end_marked below depends on: when the
; last marked user leaves, ConfBridge ends the conference for every
; end_marked user automatically.
[ai_conf_marked]
type=user
marked=yes
music_on_hold_when_empty=no ; a 3-way escalation always has the AI's own leg present first (see escalate/route.ts's join-before-redirect ordering) - there is never a genuinely empty room for either of these two to wait alone in
announce_join_leave=no
jitterbuffer=yes ; same GSM/Tailscale jitter rationale as default_user above

; The AI's own media leg (extensions.conf's [ai-conference-leg]).
[ai_conf_bot]
type=user
marked=no
; THE auto-leave mechanism this whole design leans on: once the last
; marked user (caller or human, above) leaves, Asterisk ends the
; conference for every end_marked=yes user - the AI's ConfBridge() call
; returns, its dialplan Hangup()s, the Local ;2 half dies, and the
; AudioSocket TCP connection closing is what lets
; ai-voice-agent/main.py's AudioSocketServer._handle_connection finalize
; that session. No AMI listener, no participant-counting code, and
; nothing that depends on the Next.js process still being alive at the
; moment the call actually ends - see escalate/route.ts's own header
; comment for why counting ConfbridgeLeave events was rejected in favor
; of this.
end_marked=yes
; MUST be no, and stated explicitly rather than left to whatever the
; default is: the AI leg is ALWAYS the first to join this room (see
; escalate/route.ts's ordering — it gates the caller's own Redirect on
; seeing this leg's ConfbridgeJoin first), specifically so the caller is
; never dropped into empty silence. wait_marked=yes would hold this leg
; in limbo until a marked user already existed, which is exactly the
; ordering this design avoids.
wait_marked=no
; The AI must never hear hold music — its own STT would transcribe MoH as
; caller speech and the LLM would try to respond to it.
music_on_hold_when_empty=no
announce_join_leave=no
quiet=yes
; No jitterbuffer: this leg is a loopback TCP AudioSocket connection to a
; sidecar on the SAME host, not a real network leg — there is no
; inter-arrival jitter here to smooth, and a JB would only add latency to
; the AI's already latency-sensitive turn-taking.
jitterbuffer=no
