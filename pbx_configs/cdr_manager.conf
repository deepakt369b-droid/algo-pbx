; cdr_manager — emits a `Cdr` AMI event at the end of every call.
;
; scripts/ami-cdr-listener.ts subscribes to exactly this event (the
; [algopbx-cdr-listener] account in manager.conf has `eventfilter =
; Event: Cdr`) and POSTs each one to /api/cdr. Without this module the
; listener connects to AMI successfully but never receives a single CDR
; — which is why the CallDetailRecord table stayed empty and the
; /admin/cdr + /admin/recordings pages showed nothing after real calls.
;
; This file was missing entirely; cdr_manager.so shipped "Not Running".
[general]
enabled = yes

; Include a couple of channel variables on the event so the mapper
; (src/lib/cdr-mapper.ts) has what it needs. Keep this list minimal —
; the listener only maps a handful of fields.
[mappings]
