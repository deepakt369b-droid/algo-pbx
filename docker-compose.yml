# Before this, none of the seven services below set a logging driver, so
# Docker's default json-file driver kept every line of every container's
# stdout/stderr forever with no size cap — on a long-running PBX with
# Asterisk's own verbose logging, this is a guaranteed eventual disk-fill
# that takes the whole stack down (Postgres included, since it shares the
# same volume-backed disk). Applied identically to every service via this
# YAML anchor rather than seven copies of the same three lines.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: algo-postgres
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, only on a fresh volume — gives OpenWA (service `openwa`
      # below) its own database. See that file's header for the by-hand
      # command to run this against an already-initialized volume.
      - ./vendor/openwa/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to loopback only, not 0.0.0.0 — the only consumers of this
      # published port are on the same host: the `asterisk` service (via
      # ODBC, network_mode: host, see odbc.ini's comment) and a developer
      # running a local DB client. `web` reaches Postgres over the internal
      # `algo-net` bridge DNS name instead and never needs this port at all.
      # Publishing to every interface would expose Postgres to the public
      # internet on a real cloud VM with no compensating control — tightened
      # here while wiring Phase C's ODBC dependency on this same port.
      - "127.0.0.1:5432:5432"
    networks:
      - algo-net

  # 2. Coturn STUN/TURN Server
  coturn:
    # Pinned to a moving-minor tag (verified against Docker Hub) instead of
    # :latest — :latest can silently jump across major versions with breaking
    # config changes. Once a build is verified, consider pinning by digest
    # (see DEPLOYMENT.md §5).
    image: coturn/coturn:4.17-alpine
    container_name: algo-coturn
    restart: always
    logging: *default-logging
    network_mode: host
    # Process-liveness only (this image has no curl and coturn exposes no
    # HTTP endpoint to probe) — but it's still a real improvement over the
    # previous total absence: before this, a crashed/hung turnserver
    # process was invisible to `docker ps` and orchestration, and every
    # symptom pointed at "WebRTC NAT traversal" long before anyone thought
    # to check whether the TURN process was even alive.
    healthcheck:
      test: ["CMD-SHELL", "pidof turnserver || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # Same real, CA-issued cert http.conf uses for WSS (see
      # pbx_configs/keys/README.md) — needed for the turns: (TLS) listener,
      # the escape hatch for agents behind firewalls that block plain UDP.
      - ./pbx_configs/keys:/certs:ro
    command:
      - "-n"
      - "--log-file=stdout"
      # Disjoint from Asterisk's rtp.conf range (10000-20000) — both
      # services run network_mode: host and previously claimed the
      # identical 10000-10100 range, so whichever process bound a given
      # port first won it and the other got EADDRINUSE per-port: random
      # one-way audio and call-setup failures that looked like generic
      # network flakiness. Also widened for real headroom.
      - "--min-port=20001"
      - "--max-port=30000"
      - "--realm=${COTURN_REALM}"
      - "--use-auth-secret"
      - "--static-auth-secret=${COTURN_AUTH_SECRET}"
      # Without --external-ip, coturn advertises the NIC's address in relay
      # candidates. On every major cloud provider that's a private address
      # behind 1:1 NAT (the VM's real public IP lives on the NAT/LB in
      # front of it) — browsers then try to relay to an unreachable
      # 10.x.x.x address and the TURN fallback silently fails, which
      # defeats the entire reason TURN was deployed (see sip-context.tsx's
      # iceServers wiring). Fill in the real values in .env.
      - "--external-ip=${VM_PUBLIC_IP}/${VM_PRIVATE_IP}"
      - "--listening-port=3478"
      - "--tls-listening-port=5349"
      - "--cert=/certs/fullchain.pem"
      - "--pkey=/certs/privkey.pem"
      - "--fingerprint"
      - "--no-multicast-peers"
      - "--no-cli"
      - "--stale-nonce=600"

  # 3. Asterisk 20 PBX (host network mode for direct RTP handling).
  # Builds from Dockerfile.asterisk (Loop A1) — was `image:
  # tiredofit/asterisk:20-latest`, which does not exist
  # (github.com/tiredofit/docker-asterisk 404s; every prior deploy
  # silently fell back to a hand-compiled native Asterisk running
  # `make samples` defaults instead of this repo's real pbx_configs/,
  # see handoff.md). See Dockerfile.asterisk's header comment for the
  # full recovery story, including the ODBC gap it also closes.
  asterisk:
    build:
      context: .
      dockerfile: Dockerfile.asterisk
    container_name: algo-asterisk
    restart: always
    logging: *default-logging
    network_mode: host
    # Grants the elevated scheduling priority pbx_configs/asterisk.conf's
    # highpriority=yes requests — without this capability that setting
    # silently has no effect and Asterisk stays at normal priority,
    # contending with the other four containers for CPU.
    cap_add:
      - SYS_NICE
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' | grep -q 'System uptime'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    env_file:
      - .env
    volumes:
      - ./pbx_configs/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./pbx_configs/pjsip-base.conf:/etc/asterisk/pjsip-base.conf:ro
      - ./pbx_configs/asterisk.conf:/etc/asterisk/asterisk.conf:ro
      - ./pbx_configs/modules.conf:/etc/asterisk/modules.conf:ro
      - ./pbx_configs/logger.conf:/etc/asterisk/logger.conf:ro
      # Serves the WSS (8089) transport pjsip-base.conf's [transport-wss]
      # points at — without this file nothing listens on that port at all
      # (see http.conf's own header comment for why the PJSIP bind= line
      # alone doesn't do it).
      - ./pbx_configs/http.conf:/etc/asterisk/http.conf:ro
      # DTLS-SRTP media certs (self-signed OK) + the real WSS TLS cert —
      # see pbx_configs/keys/README.md for what must be generated here
      # before agents can register at all.
      - ./pbx_configs/keys:/etc/asterisk/keys:ro
      - ./pbx_configs/confbridge.conf:/etc/asterisk/confbridge.conf:ro
      # NOT :ro — Phase A's provisioning route (in the `web` service) writes
      # this file directly, then triggers `pjsip reload` over AMI. Both
      # services bind-mount the same host path, so a write from `web` is
      # immediately visible to `asterisk` without any extra sync step.
      - ./pbx_configs/pjsip_dynamic.conf:/etc/asterisk/pjsip_dynamic.conf
      # NOT :ro — same reasoning: the Dinstar setup wizard
      # (src/lib/dinstar-provision.ts) writes this file, then triggers
      # `pjsip reload`. Was hardcoded into pjsip-base.conf's read-only
      # mount before, which meant changing the Dinstar's IP required SSH.
      - ./pbx_configs/pjsip_dinstar.conf:/etc/asterisk/pjsip_dinstar.conf
      - ./pbx_configs/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./pbx_configs/extensions.conf:/etc/asterisk/extensions.conf:ro
      # cdr_manager.so ships "Not Running" without this — it is the module
      # that emits the `Cdr` AMI event scripts/ami-cdr-listener.ts lives on.
      - ./pbx_configs/cdr_manager.conf:/etc/asterisk/cdr_manager.conf:ro
      - ./pbx_configs/manager.conf:/etc/asterisk/manager.conf.tmpl:ro
      - ./pbx_configs/queues.conf:/etc/asterisk/queues.conf:ro
      - ./pbx_configs/musiconhold.conf:/etc/asterisk/musiconhold.conf:ro
      - ./moh/default:/var/lib/asterisk/moh/default:ro
      # Custom prompts (Loop D1 follow-up) — Playback()/queues.conf
      # periodic-announce reference these as "custom/<name>" (no
      # extension; Asterisk resolves the format itself), matching the
      # standard convention of a `custom/` subdirectory under the main
      # sounds search path.
      - ./pbx_configs/sounds:/var/lib/asterisk/sounds/en/custom:ro
      # Do Not Call dialplan enforcement (Phase C) — see func_odbc.conf's
      # and odbc.ini's file-header comments for the unverified-image caveat.
      - ./pbx_configs/res_odbc.conf:/etc/asterisk/res_odbc.conf:ro
      - ./pbx_configs/func_odbc.conf:/etc/asterisk/func_odbc.conf:ro
      - ./pbx_configs/odbc.ini:/etc/odbc.ini.tmpl:ro
      - ./pbx_configs/odbcinst.ini:/etc/odbcinst.ini:ro
      - ./recordings:/var/spool/asterisk/monitor
      - ./pbx_configs/voicemail.conf:/etc/asterisk/voicemail.conf:ro
      # NOT :ro, same reasoning as pjsip_dynamic.conf above — the `web`
      # service (Phase A/E provisioning) writes this file, asterisk reads it.
      - ./pbx_configs/voicemail_dynamic.conf:/etc/asterisk/voicemail_dynamic.conf
      # Asterisk writes voicemail messages here; `web` reads them read-only
      # (src/app/api/voicemail) to list/stream/delete, mirroring how
      # ./recordings is shared for call recordings.
      - ./voicemail:/var/spool/asterisk/voicemail
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Algo PBX Next.js Web App
  web:
    build:
      context: ./algo-pbx-frontend
      dockerfile: Dockerfile
      target: runner
    container_name: algo-web
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    environment:
      # Next.js standalone output's generated server.js binds to
      # process.env.HOSTNAME if set, falling back to 0.0.0.0 otherwise.
      # Docker auto-sets HOSTNAME to the container's own hostname (which
      # resolves only to its bridge-network IP, not loopback) — left
      # unset, the app silently never listens on 127.0.0.1/::1 at all,
      # so this healthcheck's own `fetch('http://localhost:3000/...')`
      # gets ECONNREFUSED forever even though the app is up and the
      # externally-published port works fine (Docker's port-publish NATs
      # straight to the container's real IP, not through its loopback).
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      NEXT_PUBLIC_SIP_WS_SERVER: "wss://${VM_PUBLIC_DOMAIN}:8089/ws"
      NEXT_PUBLIC_TURN_SERVER: "turn:${VM_PUBLIC_DOMAIN}:3478"
      # Server-side (not NEXT_PUBLIC_) — used only by
      # api/me/turn-credentials to build the ICE server URL list returned
      # to an authenticated agent's browser; never sent to the client bundle.
      VM_PUBLIC_DOMAIN: "${VM_PUBLIC_DOMAIN}"
      AMI_HOST: "${AMI_HOST:-host.docker.internal}"
      AMI_PORT: "${AMI_PORT:-5038}"
      AMI_USERNAME: "${AMI_USERNAME}"
      AMI_SECRET: "${AMI_SECRET}"
      AUTH_SECRET: "${AUTH_SECRET}"
      AUTH_URL: "${AUTH_URL}"
      AUTH_TRUST_HOST: "${AUTH_TRUST_HOST:-true}"
      CDR_INGEST_SECRET: "${CDR_INGEST_SECRET}"
      # Auth for POST /api/gateway-events — the bearer secret
      # gateway-syslog-listener.ts's sidecar presents. Same shared-secret
      # pattern as CDR_INGEST_SECRET above; without this set here (not just
      # on the listener's own service block) isAuthorizedIngest() reads
      # undefined and every ingest 401s.
      GATEWAY_INGEST_SECRET: "${GATEWAY_INGEST_SECRET}"
      # Unattended cron auth for POST /api/admin/messaging/sms/poll — see
      # .env.example's crontab line.
      SMS_POLL_SECRET: "${SMS_POLL_SECRET}"
      # Loop D2 — unattended cron pruning of expired recordings/voicemail
      # (POST /api/admin/maintenance/prune), same bearer pattern as
      # SMS_POLL_SECRET above.
      PRUNE_SECRET: "${PRUNE_SECRET}"
      # OpenVPN/Headscale/connectivity task (Node F) — unattended cron auth
      # for POST /api/admin/gateway-sites/connectivity-check, same bearer
      # pattern as SMS_POLL_SECRET/PRUNE_SECRET above.
      CONNECTIVITY_CHECK_SECRET: "${CONNECTIVITY_CHECK_SECRET}"
      # Encrypts every runtime setting stored via /admin/settings or the
      # first-run /setup wizard (src/lib/settings/crypto.ts) — required
      # before either can be used; POST /api/setup refuses without it.
      SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY}"
      RECORDINGS_DIR: /recordings
      # Loop C4 — where POST /api/admin/settings/domain/apply writes
      # caddy.env + the cert-sync restart marker (see the volume mount
      # above and pbx_configs/generated/README.md).
      GENERATED_CONFIG_DIR: /generated
      PJSIP_DYNAMIC_CONF_PATH: /pjsip_dynamic.conf
      PJSIP_DINSTAR_CONF_PATH: /pjsip_dinstar.conf
      VOICEMAIL_DYNAMIC_CONF_PATH: /voicemail_dynamic.conf
      VOICEMAIL_DIR: /voicemail
      # Coturn REST ephemeral credentials (RFC 5766) — coturn runs
      # --use-auth-secret, so the browser can't use a static TURN
      # username/password; src/app/api/me/turn-credentials/route.ts mints
      # a short-lived HMAC-SHA1 credential per agent from this shared
      # secret, matching COTURN_AUTH_SECRET above.
      COTURN_AUTH_SECRET: "${COTURN_AUTH_SECRET}"
      COTURN_REALM: "${COTURN_REALM}"
      # First mail dependency in the project (Resend) — used only by the
      # admin-invite flow (src/lib/mail/resend.ts). No self-service
      # password reset exists or is added; agents cannot use this to
      # change their own credentials.
      RESEND_API_KEY: "${RESEND_API_KEY}"
      INVITE_FROM_EMAIL: "${INVITE_FROM_EMAIL:-invites@algopbx.local}"
      # Outbound webhook signing for CRM connectivity (Workstream G).
      CRM_WEBHOOK_SECRET: "${CRM_WEBHOOK_SECRET}"
      # OpenWA sidecar (Workstream E) — internal-network-only, never
      # published publicly; web reaches it over algo-net by service name.
      # Also the default OTP delivery channel (OTP_CHANNEL below) — no
      # Meta template approval or Firebase project needed for OTP to work.
      OPENWA_BASE_URL: "${OPENWA_BASE_URL:-http://openwa:2785}"
      # Must equal the openwa service's API_MASTER_KEY below — this is the
      # key the app authenticates to OpenWA's REST API with (X-API-Key).
      OPENWA_API_KEY: "${OPENWA_API_MASTER_KEY}"
      # HMAC-SHA256 secret registered on each WhatsApp session's webhook at
      # creation time (see src/lib/messaging/openwa-client.ts) — NOT read
      # by the openwa container itself as an env var; OpenWA has no global
      # webhook config, webhooks are per-session.
      OPENWA_WEBHOOK_SECRET: "${OPENWA_WEBHOOK_SECRET}"
      # Dinstar UC2000 SMS HTTP/JSON API (Workstream E) — same box the
      # voice trunk already reaches via Tailscale, see DINSTAR_LAN_IP.
      DINSTAR_LAN_IP: "${DINSTAR_LAN_IP}"
      # The gateway's own local SIP port — where Asterisk sends outbound
      # INVITEs. Default 5060; this office's UC2000 is on 5061 (see
      # settings/schema.ts DINSTAR_SIP_PORT).
      DINSTAR_SIP_PORT: "${DINSTAR_SIP_PORT:-5060}"
      DINSTAR_SMS_USERNAME: "${DINSTAR_SMS_USERNAME}"
      DINSTAR_SMS_PASSWORD: "${DINSTAR_SMS_PASSWORD}"
      # Pinned self-signed cert for dinstar-sms-provider.ts's TLS layer
      # (LLM.md §27) — a compose `environment:` block does NOT auto-pass
      # every .env key into the container, only what's declared here, same
      # as every other DINSTAR_* line above.
      DINSTAR_TLS_CERT_PEM: "${DINSTAR_TLS_CERT_PEM}"
      # Meta Cloud API fallback provider (Workstream E) — only exercised
      # when an admin flips a WaInstance's provider off OpenWA.
      META_WABA_TOKEN: "${META_WABA_TOKEN}"
      META_PHONE_NUMBER_ID: "${META_PHONE_NUMBER_ID}"
      # Agent registration: phone OTP (channel-selectable — OpenWA by
      # default, Meta Cloud or Firebase optionally — and login 2FA) and
      # profile photo storage.
      OTP_CHANNEL: "${OTP_CHANNEL:-OPENWA}"
      OTP_WA_INSTANCE_ID: "${OTP_WA_INSTANCE_ID:-}"
      NEXT_PUBLIC_FIREBASE_API_KEY: "${NEXT_PUBLIC_FIREBASE_API_KEY}"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "${NEXT_PUBLIC_FIREBASE_PROJECT_ID}"
      FIREBASE_SERVICE_ACCOUNT_JSON: "${FIREBASE_SERVICE_ACCOUNT_JSON}"
      WHATSAPP_OTP_TEMPLATE_NAME: "${WHATSAPP_OTP_TEMPLATE_NAME:-agent_otp_verification}"
      WHATSAPP_OTP_TEMPLATE_LANG: "${WHATSAPP_OTP_TEMPLATE_LANG:-en}"
      AGENT_PHOTOS_DIR: /agent-photos
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux Docker Engine needs this explicitly; Docker Desktop provides it natively.
    volumes:
      # Read-write (was :ro): the admin hard-delete route
      # (api/admin/recordings/[id]) actually unlinks files here — a
      # read-only mount meant that unlink silently no-op'd (the route
      # swallowed EROFS and reported success) while the DB row was
      # deleted anyway, orphaning the audio file permanently. See that
      # route's fix for the corresponding error-handling change.
      - ./recordings:/recordings
      # Read-write: this is the SAME host file the asterisk service mounts
      # at /etc/asterisk/pjsip_dynamic.conf — src/lib/pjsip-config.ts's
      # output gets written here by the extensions API route, then an AMI
      # `pjsip reload` (sent to the asterisk service) picks it up.
      - ./pbx_configs/pjsip_dynamic.conf:/pjsip_dynamic.conf
      # Same shared-file pattern for the Dinstar setup wizard's discovered
      # gateway IP.
      - ./pbx_configs/pjsip_dinstar.conf:/pjsip_dinstar.conf
      # Same shared-file pattern for voicemail (Phase E).
      - ./pbx_configs/voicemail_dynamic.conf:/voicemail_dynamic.conf
      # Read-write (was :ro): api/voicemail/[id] DELETE unlinks the .wav/
      # .txt pair here — same silent-EROFS bug as recordings above.
      - ./voicemail:/voicemail
      # Agent profile photos (src/lib/agent-photo.ts, POST
      # /api/register/photo). Read-write: the same container both writes
      # (on upload/replace) and serves (GET /api/me/photo/[id]) these.
      - ./agent-photos:/agent-photos
      # Read-write (Loop C4): POST /api/admin/settings/domain/apply writes
      # caddy.env and the restart-request marker here; `cert-sync` (its
      # own service below) reads both from the same host path.
      - ./pbx_configs/generated:/generated
      # OpenVPN/Headscale/connectivity task (Node F) — the connectivity-
      # check poller reads this ONE file to determine per-site OpenVPN
      # handshake freshness. Deliberately a `subpath` mount of just
      # openvpn-status.log from the `openvpn_data` named volume, NOT the
      # whole volume read-only — that volume also holds the CA/server/
      # client private keys (see openvpn-server's own volume comment
      # below), and `web` must never have filesystem access to those even
      # read-only (same "no PKI material outside the PKI containers"
      # constraint the openvpn-bridge service was built around). Requires
      # Docker Engine 20.10+/Compose v2 for volume subpath support — this
      # stack already requires `docker compose` v2 syntax elsewhere.
      #
      # DEPLOY-ORDER CAVEAT, UNVERIFIED AGAINST A LIVE ENGINE: a subpath
      # mount generally needs its target to already exist inside the
      # volume — run pbx_configs/openvpn/init-pki.sh AND start
      # openvpn-server (which is what actually creates openvpn-status.log,
      # per the `status` directive init-pki.sh appends) BEFORE the first
      # `docker compose up web` that includes this mount, or `web` may
      # fail to start / Docker may create an empty directory in place of
      # the expected file. The connectivity-check route treats a missing
      # or unreadable file as "no data yet" rather than crashing, but
      # `web` refusing to START at all over this is a real risk worth a
      # deliberate check during G1's deploy, not assumed away here.
      - type: volume
        source: openvpn_data
        target: /app/openvpn-status.log
        read_only: true
        volume:
          subpath: openvpn-status.log
      # OpenVPN/Headscale/connectivity task (Node D) — the two sides of
      # openvpn-bridge's file-drop contract (see
      # pbx_configs/openvpn/bridge-watch.sh's header for the full
      # request/response spec). `web` only ever WRITES empty
      # <site>.generate/.revoke marker files into requests/, and only ever
      # READS the resulting <site>.ovpn/.done/.error files from clients/ —
      # never the other way, hence the asymmetric :ro on clients/ only.
      # Real bind mounts (not the openvpn_data named volume above), same
      # host paths openvpn-bridge itself mounts, so a write from one side
      # is immediately visible to the other with no extra sync step —
      # matches the existing pjsip_dynamic.conf/pjsip_dinstar.conf pattern
      # already used elsewhere in this same volumes list.
      - ./pbx_configs/openvpn/requests:/app/openvpn-requests
      - ./pbx_configs/openvpn/clients:/app/openvpn-clients:ro
    ports:
      # Loop B0: bind to loopback only. Docker-published ports bypass ufw's
      # INPUT chain entirely, so `"3000:3000"` exposed the whole Next.js app
      # — /api/setup, the login endpoints, invite-token consumption — in
      # CLEARTEXT on every interface, sidestepping Caddy's TLS. All external
      # traffic must go through Caddy on 80/443. Local access for the SSH
      # tunnel / a same-host healthcheck still works via 127.0.0.1.
      - "127.0.0.1:3000:3000"
    networks:
      - algo-net
    depends_on:
      postgres:
        condition: service_healthy

  # 5. CDR ingestion listener — a standalone long-running AMI subscriber,
  # deliberately NOT part of the `web` service. See
  # algo-pbx-frontend/scripts/ami-cdr-listener.ts's file-header comment for
  # why this couldn't be a Next.js instrumentation.ts hook instead (no
  # single-execution guarantee across workers/restarts for a stateful AMI
  # connection). Talks to `web` over the internal `algo-net` network, not a
  # published port.
  cdr-listener:
    build:
      context: ./algo-pbx-frontend
      dockerfile: Dockerfile
      target: cdr-listener
    container_name: algo-cdr-listener
    restart: always
    logging: *default-logging
    environment:
      AMI_HOST: "${AMI_HOST:-host.docker.internal}"
      AMI_PORT: "${AMI_PORT:-5038}"
      # Uses the narrowly-scoped [algopbx-cdr-listener] AMI account (see
      # manager.conf) instead of sharing [algopbx-app]'s full event class
      # subscription — this process only ever needs Cdr events.
      AMI_USERNAME: "${CDR_AMI_USERNAME:-algopbx-cdr-listener}"
      AMI_SECRET: "${CDR_AMI_SECRET}"
      CDR_INGEST_URL: "http://web:3000/api/cdr"
      CDR_INGEST_SECRET: "${CDR_INGEST_SECRET}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - algo-net
    depends_on:
      web:
        condition: service_healthy

  # 5b. Dinstar gateway syslog listener — a standalone UDP intake process
  # for the gateway's Diagnostic -> Syslog forwarding feature (NOT the
  # generic Tools -> Remote Server page, an unrelated feature). Deliberately
  # NOT part of the `web` service, same reasoning as `cdr-listener` above:
  # a small, isolated process facing untrusted network input (a UDP socket
  # with no auth at the syslog transport layer) that can be restarted
  # independently and keeps the web tier's own attack surface unchanged.
  #
  # network_mode: host (like `asterisk` and `coturn` above) — NOT the
  # `algo-net` bridge `cdr-listener` uses. This process must bind the VPS's
  # actual Tailscale interface IP on a specific port; a bridge network only
  # ever gives it a private 172.x address with no route to the tailnet the
  # Dinstar gateway is reached over. Reaches `web` via the SAME loopback
  # port `web`'s own `ports:` block publishes (127.0.0.1:3000), which host
  # networking makes directly reachable — no algo-net DNS needed here.
  gateway-syslog-listener:
    build:
      context: ./algo-pbx-frontend
      dockerfile: Dockerfile
      target: syslog-listener
    container_name: algo-gateway-syslog-listener
    restart: always
    logging: *default-logging
    network_mode: host
    environment:
      # MUST be the VPS's real Tailscale IP (e.g. `tailscale ip -4`), never
      # 0.0.0.0 — the listener itself refuses to start without this set,
      # see gateway-syslog-listener.ts's own startup check. Set in .env.
      SYSLOG_BIND_IP: "${SYSLOG_BIND_IP}"
      SYSLOG_BIND_PORT: "${SYSLOG_BIND_PORT:-5514}"
      # OpenVPN/Headscale/connectivity task (Node F) — optional second bind
      # (10.8.0.1, the OpenVPN tunnel's server-side address) so this
      # listener keeps receiving on BOTH paths during the cutover
      # transition. Unset by default — set only after G2 re-points the
      # gateway's Diagnostic -> Syslog target; see the script's own header.
      SYSLOG_BIND_IP_SECONDARY: "${SYSLOG_BIND_IP_SECONDARY:-}"
      GATEWAY_EVENTS_INGEST_URL: "http://127.0.0.1:3000/api/gateway-events"
      GATEWAY_INGEST_SECRET: "${GATEWAY_INGEST_SECRET}"
    depends_on:
      web:
        condition: service_healthy

  # 5c. OpenVPN server — the Dinstar gateway's PRIMARY connectivity path
  # (operator decision: OpenVPN primary, Headscale fallback, Tailscale
  # deprecated once this is proven live end-to-end — see the task plan).
  # kylemanna/docker-openvpn: bundles easyrsa PKI management
  # (ovpn_genconfig/ovpn_initpki/ovpn_getclient/easyrsa) so this doesn't
  # need hand-rolled PKI scripting — see pbx_configs/openvpn/README.md for
  # the one-time setup this image still needs (PKI init is NOT automatic).
  #
  # network_mode: host, not the algo-net bridge — NOT just "matches
  # coturn/asterisk convention" here, it's actually required: the tun0
  # interface OpenVPN creates only exists inside whichever network
  # namespace this container runs in. On bridge networking, 10.8.0.1 (the
  # tunnel's server-side address) would only be reachable from INSIDE this
  # container — but gateway-syslog-listener (also network_mode: host, see
  # its own block above) needs to bind that same address once the syslog
  # dual-homing work lands, and `web` needs to reach it too. Host
  # networking makes tun0 a real, host-visible interface both of those can
  # actually use.
  #
  # LEGACY-CLIENT COMPATIBILITY: the Dinstar's embedded OpenVPN client is
  # old firmware (confirmed live: its VPN Parameter page offers no
  # cipher/auth negotiation at all — a fixed-suite old client). openvpn.conf
  # (generated by pbx_configs/openvpn/init-pki.sh, NOT this compose file)
  # deliberately sets AES-256-CBC / SHA256 / tls-version-min 1.0 /
  # data-ciphers-fallback rather than modern AEAD-cipher defaults, which
  # would silently fail to handshake against it — see that script's own
  # header for the full reasoning. Don't "modernize" the generated config
  # without re-testing against the real device.
  openvpn-server:
    image: kylemanna/openvpn
    container_name: algo-openvpn-server
    restart: always
    logging: *default-logging
    # Explicit rather than relying on the image's own implicit default —
    # ovpn_run is the image's normal "start the actual VPN daemon" command
    # (as opposed to ovpn_genconfig/ovpn_initpki, the one-time setup
    # commands run manually via init-pki.sh, never as this service's
    # steady-state command).
    command: ["ovpn_run"]
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      # PKI + generated openvpn.conf live ONLY in this named volume — never
      # bind-mounted to the host checkout, so private key material can
      # never end up in this git-tracked directory even by accident. See
      # pbx_configs/openvpn/README.md.
      - openvpn_data:/etc/openvpn
      - ./pbx_configs/openvpn/init-pki.sh:/scripts/init-pki.sh:ro
    environment:
      VM_PUBLIC_IP: "${VM_PUBLIC_IP}"

  # 5d. openvpn-bridge — the ONLY way the web app can get a client cert
  # generated/revoked without ever holding a Docker socket itself or
  # storing OpenVPN private key material in Postgres (see the task plan's
  # "Critical design constraint" on this node). Same image, same shared
  # openvpn_data volume as openvpn-server above, but this container never
  # runs the VPN daemon — its entrypoint is bridge-watch.sh, a poll loop
  # that watches a file-drop request queue and runs easyrsa/ovpn_getclient
  # against the shared PKI directory. See bridge-watch.sh's own header for
  # the exact request/response file contract the web app's caller-side
  # code (a later task) must match.
  #
  # requests/ and clients/ are real host bind-mounts (unlike the PKI
  # volume above) SPECIFICALLY so `web` can be given its own mount of the
  # same two directories once its caller-side route is built — requests/
  # holds only empty marker files, but clients/ holds real .ovpn files
  # with embedded private keys, so both are gitignored
  # (pbx_configs/openvpn/README.md documents this split explicitly).
  #
  # NOT network_mode: host — this container never touches a tun interface
  # or does any routing, it only runs local CLI commands against a shared
  # volume; algo-net is fine (and it doesn't strictly need to reach
  # anything else on it either, kept for compose convention consistency).
  openvpn-bridge:
    image: kylemanna/openvpn
    container_name: algo-openvpn-bridge
    restart: always
    logging: *default-logging
    entrypoint: ["/bin/bash", "/scripts/bridge-watch.sh"]
    networks:
      - algo-net
    volumes:
      - openvpn_data:/etc/openvpn
      - ./pbx_configs/openvpn/bridge-watch.sh:/scripts/bridge-watch.sh:ro
      - ./pbx_configs/openvpn/requests:/requests
      - ./pbx_configs/openvpn/clients:/clients
    depends_on:
      - openvpn-server

  # 6. OpenWA sidecar (Workstream E) — WhatsApp engine, MIT-licensed,
  # vendored under vendor/openwa (see that directory's README for why
  # OpenWA over evolution-go: no license-activation gate, actively
  # maintained, dual whatsapp-web.js/baileys engine choice). Never exposed
  # publicly — web reaches it over algo-net by service name
  # (OPENWA_BASE_URL) and it is not in `ports:`. Pairing/QR/session
  # management is entirely OUR OWN UI (src/app/admin/whatsapp/page.tsx,
  # requireAdminSession-gated) calling OpenWA's REST API — there is no
  # reverse proxy to OpenWA's own dashboard anywhere in this stack.
  #
  # Builds directly from upstream's own multi-stage Dockerfile (Chromium/
  # ffmpeg/postgres-client image with several backport patches applied at
  # build time — not something worth re-deriving by hand). Run
  # `bash vendor/openwa/prepare.sh` before the first build (and again
  # whenever the pinned commit changes) to fetch the source into
  # vendor/openwa/upstream/ at the exact commit that script pins.
  openwa:
    build:
      context: ./vendor/openwa/upstream
    container_name: algo-openwa
    restart: always
    logging: *default-logging
    environment:
      NODE_ENV: production
      # >= 32 chars in production — OpenWA refuses to boot otherwise. Must
      # equal `web`'s OPENWA_API_KEY above.
      API_MASTER_KEY: "${OPENWA_API_MASTER_KEY}"
      ENGINE_TYPE: "${OPENWA_ENGINE:-baileys}"
      # baileys default (not whatsapp-web.js): ~30-80MB RAM per session vs
      # ~300-500MB, and this deployment runs up to 4 concurrent instances
      # (one per Dinstar SIM, see WaInstance) on the same modest cloud VM
      # already carrying Asterisk's media engine. whatsapp-web.js's lower
      # ban risk (it simulates real WhatsApp Web browser traffic) is worth
      # revisiting if ban rate becomes a problem in practice.
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      # A dedicated database (see vendor/openwa/initdb/), not a schema
      # inside algopbx_db — upstream's config takes a whole database name,
      # not a `?schema=` URL fragment.
      DATABASE_NAME: openwa
      DATABASE_USERNAME: "${POSTGRES_USER}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      DATABASE_SYNCHRONIZE: "false"
      SESSION_DATA_PATH: /app/data/sessions
      BAILEYS_AUTH_DIR: /app/data/baileys
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      # Ask WhatsApp for a LARGE initial history sync on the next (re-)pair.
      # Baileys' `getChatHistory` scroll-back is a library limitation (it
      # can't fetch older messages on demand the way whatsapp-web.js's real
      # browser can), so the one-time history-sync payload WhatsApp pushes at
      # link time is effectively the whole backlog we get. Default (false) is
      # a few months; true pulls up to ~1 year+, at the cost of a slower,
      # heavier first connect. Takes effect only when a session is paired
      # fresh — existing sessions keep whatever they already synced.
      BAILEYS_SYNC_FULL_HISTORY: "true"
      # Webhooks are registered PER SESSION by the app at pairing time
      # (src/lib/messaging/openwa-client.ts registerSessionWebhook), not
      # via a global env var — OpenWA has no such var. SSRF protection is
      # on by default and would otherwise refuse a webhook URL pointing at
      # the private `web` service.
      WEBHOOK_SSRF_PROTECT: "true"
      SSRF_ALLOWED_HOSTS: "web"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    volumes:
      # Session credentials/media persist here. WITHOUT this volume every
      # paired WhatsApp number is wiped on container restart/recreate —
      # confirmed as the cause of "the current pair cannot be
      # refreshed/deleted" (there was never anything durable behind it).
      - openwa_data:/app/data
    networks:
      - algo-net
    depends_on:
      postgres:
        condition: service_healthy

  # 7. Caddy reverse proxy — terminates HTTPS for the web app on 443 and
  # redirects port 80. Loop C4: builds from Dockerfile.caddy (adds the
  # Cloudflare DNS-01 plugin) instead of pulling caddy:2-alpine directly,
  # and issues its OWN Let's Encrypt certificate — see Caddyfile's header
  # comment for the full design and why `cert-sync` (below) still exists
  # even though Caddy is now self-sufficient for its own TLS (Asterisk/
  # Coturn need the same cert copied into pbx_configs/keys/, and can't
  # read Caddy's own ACME storage directly).
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: algo-caddy
    restart: always
    logging: *default-logging
    # DISABLED 2026-08-31 (LLM.md §27): this was `wget --spider` against
    # localhost:80, correct in intent (a crashed/misconfigured Caddy is
    # otherwise invisible — it's the only thing serving 443) but it sat
    # `unhealthy` for 2+ days straight in production with EVERY probe
    # failing `"OCI runtime exec failed: ... procReady not received"` —
    # a containerd/runc-level failure to spawn the exec'd process at all,
    # not wget or Caddy misbehaving. A full `docker restart algo-caddy`
    # reset the accumulated FailingStreak but the very next probe failed
    # the same way, proving this is a host/runtime-level issue, not a
    # stuck state a restart clears. The whole time, real HTTPS traffic
    # was served correctly (verified: curl 200, live agent traffic in
    # Caddy's own access log) — Docker's exec channel into this
    # container is broken independent of whether Caddy itself is fine.
    # No other service actually gates on this: cert-sync's `depends_on:
    # caddy` is `condition: service_started`, not `service_healthy`. A
    # false-`unhealthy` status is worse than none (it trains the
    # operator to ignore it) so this is disabled outright rather than
    # left generating permanent noise. If crash visibility is wanted
    # again, it needs an external check (e.g. curl from another
    # container or the host) — Compose's HEALTHCHECK always execs
    # inside the target container's namespace, so no in-container test
    # command can dodge this same failure mode.
    healthcheck:
      disable: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    # NOT a static `environment:` block for VM_PUBLIC_DOMAIN/
    # CLOUDFLARE_API_TOKEN — see pbx_configs/generated/README.md for why
    # these specifically need to live in an env_file (admin-editable via
    # /admin/settings, then a container recreate by `cert-sync` — Docker
    # only reads env_file at container-CREATE time). `required: false` so
    # Compose doesn't refuse to start before scripts/render-caddy-env.sh
    # has ever run.
    env_file:
      - path: ./pbx_configs/generated/caddy.env
        required: false
    volumes:
      # NOT ./Caddyfile (the repo-root one is a safe template/fallback
      # only, see its own header comment for why after a real crash-loop
      # bug) — the generated one is what render-caddy-env.sh seeds on
      # first bring-up and POST /api/admin/settings/domain/apply rewrites
      # once a real domain is configured.
      - ./pbx_configs/generated/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - algo-net
    depends_on:
      web:
        condition: service_healthy

  # 8. cert-sync — copies Caddy's Let's Encrypt cert into the shared
  # pbx_configs/keys/ path Asterisk WSS and Coturn TLS read, and recreates
  # `caddy` when /admin/settings' "Domain & TLS" section rewrites
  # pbx_configs/generated/caddy.env. THE ONLY CONTAINER IN THIS STACK
  # GRANTED THE DOCKER SOCKET — a deliberate, narrow tradeoff for "no
  # manual restart step" full domain automation (Loop C4), not a free
  # win: this container can control any container on the host. Scoped as
  # tightly as the job allows: read-only access to Caddy's cert storage,
  # write access only to pbx_configs/keys/, and the socket only to run
  # `docker compose up -d --no-deps <service>` for the three services it
  # actually needs to recreate (see scripts/cert-sync.sh).
  cert-sync:
    image: docker:27-cli
    container_name: algo-cert-sync
    restart: always
    logging: *default-logging
    entrypoint: ["/bin/sh", "/scripts/cert-sync.sh"]
    environment:
      VM_PUBLIC_DOMAIN: "${VM_PUBLIC_DOMAIN}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only, and NOT used as `docker compose`'s project directory —
      # see scripts/cert-sync.sh's header comment for why a bind-mounted
      # path inside THIS container is meaningless to the Docker daemon
      # (the daemon runs on the host, reached via the socket above; any
      # `docker compose` invocation from in here must reference a path
      # the HOST can resolve, which this container discovers about
      # itself via `docker inspect`, not from this mount). Kept only so
      # the script can read docker-compose.yml's own content if needed.
      - .:/workspace:ro
      - caddy_data:/caddy_data:ro
      - ./pbx_configs/keys:/keys
      - ./pbx_configs/generated:/generated
      - ./scripts/cert-sync.sh:/scripts/cert-sync.sh:ro
    depends_on:
      caddy:
        condition: service_started

  # 9. Headscale — self-hosted Tailscale control plane, the DOCUMENTED
  # FALLBACK connectivity path for a gateway site (OpenVPN is primary, see
  # the openvpn-server service above and /admin/connectivity). Own
  # subdomain (vpn.${VM_PUBLIC_DOMAIN}) behind Caddy — see
  # POST /api/admin/settings/domain/apply's Caddyfile-render extension.
  # SQLite-backed (no Postgres — nothing else in this single-VPS stack
  # needs HA either). Admin CLI (user/preauth-key creation) goes through
  # `docker exec algo-headscale headscale ...` against the Unix socket in
  # config.yaml, not a published gRPC port.
  #
  # STOCK image, no custom Dockerfile — the original design (a
  # Dockerfile.headscale that installed gettext + ran envsubst at
  # container start) does not work: headscale/headscale is a `ko`-built
  # distroless image with NO shell and NO package manager at all
  # (confirmed live: /bin/sh doesn't exist, `apk add` and even `ls` both
  # fail). VM_PUBLIC_DOMAIN is instead substituted on the HOST by
  # scripts/render-headscale-config.sh (run once before first bring-up,
  # mirrors render-caddy-env.sh's own pattern) into
  # pbx_configs/headscale/generated/config.yaml, bind-mounted read-only
  # below. The healthcheck is CMD array form (not CMD-SHELL, which also
  # needs a shell that isn't there) invoking the headscale binary
  # directly — `nodes list` talking over the Unix socket in config.yaml is
  # the same liveness signal the admin CLI itself relies on.
  headscale:
    image: headscale/headscale:0.23.0
    container_name: algo-headscale
    restart: always
    logging: *default-logging
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/ko-app/headscale", "nodes", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      # Persists the SQLite DB + Noise/WireGuard keys — without this every
      # node registration and pre-auth key is wiped on container
      # recreate, same failure mode openwa_data's own comment documents
      # for OpenWA sessions.
      - headscale_data:/var/lib/headscale
      # Host-rendered (scripts/render-headscale-config.sh) — see the
      # service comment above for why this can't be templated inside the
      # container itself.
      - ./pbx_configs/headscale/generated/config.yaml:/etc/headscale/config.yaml:ro
    networks:
      - algo-net

volumes:
  postgres_data:
  openwa_data:
  caddy_data:
  caddy_config:
  headscale_data:
  # PKI (CA/server/client certs+keys) + generated openvpn.conf for the
  # OpenVPN server — see pbx_configs/openvpn/README.md for why this is a
  # named Docker volume, not a bind mount into the git-tracked checkout.
  openvpn_data:

networks:
  algo-net:
    driver: bridge
